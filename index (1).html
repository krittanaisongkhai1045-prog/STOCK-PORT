<style>
/* ===== Dime Portfolio — mobile-app style ===== */
:root{
  --bg:#070708; --bg2:#1a0a0d;
  --surface:#121214; --surface2:#1c1c20; --line:rgba(255,255,255,.08);
  --text:#f5f5f7; --muted:#9b9ba6; --faint:#5d5d68;
  --accent:#ff3b4e; --accent-ink:#ffffff;
  --buy:#ff3b4e; --hold:#8a8a96; --watch:#ffb547; --down:#ff6b7a; --up:#34d399;
  --shadow:0 10px 30px rgba(0,0,0,.55);
  --ease:cubic-bezier(.22,1,.36,1);
  --nav-h:72px;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Inter','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:radial-gradient(1200px 700px at 20% -10%,var(--bg2),var(--bg));
  color:var(--text); -webkit-font-smoothing:antialiased; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---- phone shell ---- */
#app{
  position:relative; width:100%; height:100dvh; max-width:430px; overflow:hidden;
  background:var(--bg); display:flex; flex-direction:column;
}
@media (min-width:600px){
  #app{height:min(880px,calc(100dvh - 32px)); border-radius:44px;
    box-shadow:0 0 0 10px #05070f, 0 0 0 11px rgba(255,255,255,.08), 0 40px 90px rgba(0,0,0,.55);}
}

/* ---- splash ---- */
#splash{position:absolute;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease .1s, visibility .6s}
#splash.out{opacity:0;visibility:hidden}
.logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(145deg,#ff3b4e,#ff7a45);
  display:grid;place-items:center;box-shadow:0 14px 40px rgba(255,59,78,.45);animation:pop .8s var(--ease) both}
.logo svg{width:40px;height:40px}
.splash-t{font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--muted);animation:fadeUp .7s .25s var(--ease) both}
.splash-bar{width:120px;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.splash-bar i{display:block;height:100%;width:100%;background:var(--accent);transform:translateX(-100%);animation:load 1s .2s var(--ease) forwards}
@keyframes load{to{transform:none}}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}

/* ---- top bar ---- */
header{flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:max(env(safe-area-inset-top),18px) 18px 10px;position:relative;z-index:5}
.hello small{display:block;color:var(--muted);font-size:12px}
.hello b{font-size:19px;letter-spacing:-.01em}
.tools{display:flex;gap:8px}
.icon-btn{height:38px;min-width:38px;padding:0 11px;border-radius:14px;background:var(--surface);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);
  transition:transform .15s var(--ease), background .2s, color .2s}
.icon-btn:active{transform:scale(.88)}
.icon-btn.on{color:var(--accent-ink);background:var(--accent)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- scrolling views ---- */
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:6px 16px calc(var(--nav-h) + 28px);
  scrollbar-width:none;overscroll-behavior-y:contain}
.view::-webkit-scrollbar{display:none}
.view.enter-r{animation:inR .45s var(--ease) both}
.view.enter-l{animation:inL .45s var(--ease) both}
.view.enter-n{animation:fade .3s ease both}
@keyframes inR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rise{animation:fadeUp .6s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms + 60ms)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* pull to refresh */
#ptr{position:absolute;top:-6px;left:50%;width:34px;height:34px;margin-left:-17px;border-radius:50%;z-index:4;
  background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;opacity:0;
  transform:translateY(0) scale(.6);pointer-events:none;box-shadow:var(--shadow)}
#ptr svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2.4;stroke-linecap:round}
#ptr.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}
.card h3{margin:0 0 14px;font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:600;
  display:flex;justify-content:space-between;align-items:center}
.card h3 a{color:var(--accent);font-weight:600;cursor:pointer;letter-spacing:0}
.hero{background:linear-gradient(150deg,#4d0c17 0%,#250a10 50%,#0f0507 100%);color:#fff;border:0;position:relative;overflow:hidden;
  box-shadow:var(--shadow)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.5;animation:float 9s ease-in-out infinite}
.hero::before{width:190px;height:190px;background:#ff3b4e;right:-60px;top:-70px;opacity:.35}
.hero::after{width:150px;height:150px;background:#ff7a45;left:-50px;bottom:-60px;opacity:.3;animation-delay:-4s}
@keyframes float{50%{transform:translate(20px,16px) scale(1.15)}}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:12px;color:rgba(255,255,255,.7);letter-spacing:.04em}

<script>
/* Dime Portfolio — แอปดูพอร์ต อ่าน/เขียนข้อมูลผ่าน Supabase (ดู boot.js) */
window.startApp = (initial, api) => {
'use strict';
let D = initial;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

/* ---------- state ---------- */
const S = {
  tab: 'home', cur: store.get('cur', 'THB'), hide: store.get('hide', '0') === '1',
  filter: 'ALL', seg: 'trades', sim: Math.max(D.contributionThb || 0, 1000), legendHi: -1
};
const TABS = ['home', 'holdings', 'rebalance', 'activity', 'tax'];
const TITLES = { home: ['พอร์ตของฉัน', 'ภาพรวม'], holdings: ['สินทรัพย์ทั้งหมด', 'พอร์ต'], rebalance: ['เงินใหม่ → ซื้ออะไรดี', 'Rebalance'],
  activity: ['ประวัติทั้งหมด', 'รายการ'], tax: ['บันทึกเพื่อยื่นภาษี', 'ภาษี & เงินสด'] };

/* ---------- calculations (ตรรกะเดียวกับ Excel) ---------- */
let FX = D.fx;
let buys = D.trades.filter(t => t.shares > 0);
function calc() {
  const hs = D.holdings.map(h => {
    const value = h.shares * h.price;
    const tr = buys.filter(t => t.symbol === h.symbol);
    const costUsd = tr.reduce((a, t) => a + (t.action === 'SELL' ? -t.net : t.net), 0);
    const costThb = tr.reduce((a, t) => a + (t.action === 'SELL' ? -t.netThb : t.netThb), 0);
    return { ...h, value, costUsd, costThb, trades: tr };
  });
  const total = hs.reduce((a, h) => a + h.value, 0);
  hs.forEach(h => {
    h.cur = h.value / total;
    h.status = h.cur < h.target * .95 ? 'BUY' : h.cur > h.target * 1.2 ? 'WATCH' : 'HOLD';
    h.gap = Math.max(0, h.target * total - h.value);
    h.pl = h.value - h.costUsd; h.plPct = h.costUsd ? h.pl / h.costUsd : 0;
  });
  const costUsd = hs.reduce((a, h) => a + h.costUsd, 0), costThb = hs.reduce((a, h) => a + h.costThb, 0);
  return { hs, total, costUsd, costThb, buyN: hs.filter(h => h.status === 'BUY').length, watchN: hs.filter(h => h.status === 'WATCH').length };
}
let C = calc();
const PAL = ['#e11d38', '#ff6a3d', '#d99a1e', '#8e8e99', '#c2415b', '#7a2431'];
const OTHER = '#4a4a54';
const colorOf = {};
function recolor() { Object.keys(colorOf).forEach(k => delete colorOf[k]); [...C.hs].sort((a, b) => b.value - a.value).forEach((h, i) => colorOf[h.symbol] = PAL[i] || OTHER); }
recolor();
function setData(nd) { D = nd; FX = D.fx; buys = D.trades.filter(t => t.shares > 0); C = calc(); recolor(); }

/* ---------- formatting ---------- */
const nf = (v, d = 2) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtMoney = (usd, d = 2) => S.cur === 'THB' ? '฿' + nf(usd * FX, d) : '$' + nf(usd, d);
const fmtSigned = (usd, d = 2) => (usd < 0 ? '−' : '+') + fmtMoney(Math.abs(usd), d);
const thb = v => '฿' + nf(v, 2), usd = v => '$' + nf(v, 2);
const pct = (v, d = 1) => nf(v * 100, d) + '%';
const dateTh = s => new Date(s + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
const mark = s => s.replace('.', '').slice(0, 4);
// ตัวเลขที่นับขึ้นได้: <span class="amt num" data-kind data-v>
function A(kind, v, extra = '') {
  return `<span class="amt num" data-k="${kind}" data-v="${v}" ${extra}>${fmtK(kind, v)}</span>`;
}
function fmtK(k, v) {
  switch (k) {
    case 'money': return fmtMoney(v);
    case 'money0': return fmtMoney(v, 0);
    case 'signed': return fmtSigned(v);
    case 'thb': return thb(v); case 'usd': return usd(v);
    case 'pct': return pct(v); case 'spct': return (v < 0 ? '−' : '+') + pct(Math.abs(v), 2);
    case 'int': return String(Math.round(v)); case 'fx': return nf(v, 2);
    default: return String(v);
  }
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(root) {
  $$('[data-k]', root).forEach(el => {
    const k = el.dataset.k, to = +el.dataset.v;
    if (reduced || !isFinite(to) || to === 0) { el.textContent = fmtK(k, to); return; }
    const t0 = performance.now(), dur = 900 + Math.random() * 250;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      el.textContent = fmtK(k, to * e);
      if (p < 1) requestAnimationFrame(step); else el.textContent = fmtK(k, to);
    };
    requestAnimationFrame(step);
  });
}
const rise = (i = 0) => `style="--i:${i}"`;

/* ---------- views ---------- */
const V = {};

V.home = () => {
  const { hs, total, costUsd, costThb } = C;
  const plUsd = total - costUsd, plThb = total * FX - costThb;
  const pl = S.cur === 'THB' ? plThb : plUsd, plp = (S.cur === 'THB' ? plThb / costThb : plUsd / costUsd) || 0;
  const cls = pl >= 0 ? 'up' : 'down';
  const todo = hs.filter(h => h.status === 'BUY').sort((a, b) => b.gap - a.gap);
  const watch = hs.filter(h => h.status === 'WATCH');
  const divNet = D.tax.reduce((a, t) => a + t.netDivThb, 0), gain = D.tax.reduce((a, t) => a + t.realizedThb, 0);
  const funded = D.cashflow.filter(c => c.direction === 'THB-USD').reduce((a, c) => a + c.thb, 0);
  return `
  <div class="card hero rise" ${rise(0)}>
    <div class="lbl">มูลค่าพอร์ตรวม · ${S.cur}</div>
    <div class="big">${A('money', total)}</div>
    <span class="chip ${cls}">${pl >= 0 ? '▲' : '▼'} <span>${A('signed', S.cur === 'THB' ? plThb / FX : plUsd)}</span><span>(${A('spct', plp)})</span></span>
    <div class="sub"><span>ต้นทุนสุทธิ ${S.cur === 'THB' ? A('thb', costThb) : A('usd', costUsd)}</span><span>อัปเดต ${dateTh(D.updated)}</span></div>
  </div>
  <div class="tiles rise" ${rise(1)}>
    <button class="tile" data-go="rebalance"><small>FX THB/USD</small><b class="num">${A('fx', FX)}</b></button>
    <button class="tile buy" data-go="holdings" data-f="BUY"><small>หุ้นที่ BUY</small><b>${A('int', C.buyN)}</b></button>
    <button class="tile watch" data-go="holdings" data-f="WATCH"><small>WATCH</small><b>${A('int', C.watchN)}</b></button>
  </div>
  <div class="card rise" ${rise(2)}>
    <h3>สัดส่วนพอร์ต <a data-go="holdings">ดูทั้งหมด ›</a></h3>
    <div class="donut-wrap">
      <div class="donut"><svg viewBox="0 0 120 120" id="donut"></svg>
        <div class="mid"><b id="d-mid">${hs.length}</b><small id="d-sub">สินทรัพย์</small></div></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>
  <div class="card rise" ${rise(3)}>
    <h3>สิ่งที่ควรทำ <a data-go="rebalance">จำลองซื้อ ›</a></h3>
    ${todo.length ? todo.map(h => `
      <button class="row" data-sym="${h.symbol}">
        <div class="avatar" style="background:${colorOf[h.symbol]}">${mark(h.symbol)}</div>
        <div class="r-main"><b>${h.symbol}<span class="pill BUY">BUY</span></b>
          <small>${pct(h.cur)} / เป้า ${pct(h.target, 0)}</small>
          <div class="meter"><div class="fill" data-w="${Math.min(100, h.cur / h.target * 100)}" style="background:var(--buy)"></div></div></div>
        <div class="r-side"><b>${A('money', h.gap)}</b><small>ขาดอีก</small></div>
      </button>`).join('') : `<div class="empty"><span class="e">✅</span>พอร์ตสมดุลดี ไม่มีตัวที่ต้อง BUY</div>`}
    ${watch.map(h => `
      <button class="row" data-sym="${h.symbol}">
        <div class="avatar" style="background:${colorOf[h.symbol]}">${mark(h.symbol)}</div>
        <div class="r-main"><b>${h.symbol}<span class="pill WATCH">WATCH</span></b>
          <small>${pct(h.cur)} / เป้า ${pct(h.target, 0)} · ไม่ขายอัตโนมัติ ดูต้นทุน/ภาษีก่อน</small></div>
        <div class="r-side"><b class="neg">+${pct(h.cur - h.target)}</b><small>เกินเป้า</small></div>
      </button>`).join('')}
  </div>
  <div class="card rise" ${rise(4)}>

      <div><small>เติมเงินสะสม</small><b>${A('thb', funded)}</b></div>

      <div><small>กำไรที่รับรู้</small><b>${A('thb', gain)}</b></div>

function avgFx() {
  const f = D.cashflow.filter(c => c.direction === 'THB-USD'); const u = f.reduce((a, c) => a + c.usd, 0);
  return u ? f.reduce((a, c) => a + c.thb, 0) / u : FX;
}

V.holdings = () => {
  const list = [...C.hs].filter(h => S.filter === 'ALL' || h.status === S.filter).sort((a, b) => b.value - a.value);
  const cnt = f => f === 'ALL' ? C.hs.length : C.hs.filter(h => h.status === f).length;
  return `
  <div class="psub rise" ${rise(0)}>${C.hs.length} สินทรัพย์ · แตะเพื่อดูรายละเอียด</div>
  <div class="filters rise" ${rise(1)}>
    ${['ALL', 'BUY', 'HOLD', 'WATCH'].map(f => `<button class="fchip ${S.filter === f ? 'on' : ''}" data-filter="${f}">${f === 'ALL' ? 'ทั้งหมด' : f} · ${cnt(f)}</button>`).join('')}

  <div class="card rise" ${rise(2)} style="padding:6px 16px">

    <button class="row" data-sym="${h.symbol}" style="animation:fadeUp .5s var(--ease) both;animation-delay:${i * 45 + 150}ms">

        <small>${pct(h.cur)} · เป้า ${pct(h.target, 0)}</small>
        <div class="meter"><div class="fill" data-w="${Math.min(100, h.cur / Math.max(h.target, h.cur) * 100)}" style="background:var(--${h.status.toLowerCase()})"></div>
        <div class="tgt" style="left:${h.target / Math.max(h.target, h.cur) * 100}%"></div></div></div>

    </button>`).join('') || '<div class="empty">ไม่มีรายการ</div>'}
  </div>`;
};

function allocate(contribThb) {
  const add = contribThb / FX, tot = C.total + add;
  const rows = C.hs.map(h => ({ ...h, gap2: Math.max(0, h.target * tot - h.value) }));
  const sumGap = rows.reduce((a, r) => a + r.gap2, 0), scale = sumGap > 0 ? Math.min(1, add / sumGap) : 0;
  rows.forEach(r => { r.buyUsd = r.gap2 * scale; r.buyShares = r.buyUsd / r.price; r.after = (r.value + r.buyUsd) / tot; });
  return { rows, add, sumGap };
}
V.rebalance = () => {
  const { rows, add, sumGap } = allocate(S.sim);
  const list = [...rows].sort((a, b) => b.buyUsd - a.buyUsd || b.gap2 - a.gap2);
  return `
  <div class="psub rise" ${rise(0)}>เติมเงินใหม่ก่อน — ตัวที่เกินเป้าให้ WATCH ไม่ขายอัตโนมัติ</div>
  <div class="card rise" ${rise(1)}>
    <h3>จำลองเงินลงทุนใหม่</h3>
    <div class="sim-amt num" id="sim-amt">${thb(S.sim)}</div>
    <div class="buyline"><span>≈ <span id="sim-usd">${usd(add)}</span></span><span>FX ${nf(FX, 2)}</span></div>
    <input type="range" id="sim" min="0" max="30000" step="100" value="${S.sim}" aria-label="เงินลงทุนใหม่ (บาท)">
    <div class="quick">${[500, 1000, 3000, 5000, 10000].map(v => `<button class="fchip" data-q="${v}">${nf(v, 0)}</button>`).join('')}</div>

  <div class="note rise" ${rise(3)}>กติกาเดียวกับ Excel: BUY เมื่อสัดส่วนปัจจุบัน &lt; 95% ของเป้า · WATCH เมื่อ &gt; 120% ของเป้า · เงินใหม่แจกตามสัดส่วนช่องว่างถึงเป้าหมาย (ผลจำลองเท่านั้น ไม่ใช่คำแนะนำการลงทุน)</div>`;
};
function simRows(list) {
  return list.map((r, i) => `
  <button class="row" data-sym="${r.symbol}">
    <div class="avatar" style="background:${colorOf[r.symbol]}">${mark(r.symbol)}</div>
    <div class="r-main"><b>${r.symbol}<span class="pill ${r.status}">${r.status}</span></b>
      <small>${pct(r.cur)} → <b style="display:inline;color:var(--text)">${pct(r.after)}</b> · เป้า ${pct(r.target, 0)}</small>
      <div class="meter"><div class="fill" data-w="${Math.min(100, r.after / Math.max(r.target, r.after) * 100)}" style="background:var(--${r.status.toLowerCase()})"></div>
      <div class="tgt" style="left:${r.target / Math.max(r.target, r.after) * 100}%"></div></div></div>
    <div class="r-side">${r.buyUsd > 0.005 ? `<b class="pos">+${thb(r.buyUsd * FX)}</b><small>~${nf(r.buyShares, 4)} หุ้น</small>` : `<b style="color:var(--faint)">—</b><small>ถึงเป้าแล้ว</small>`}</div>
  </button>`).join('');
}

  if (S.seg === 'trades') items = buys.map(t => ({ d: t.date, html: `

/* ---------- donut ---------- */
function drawDonut() {
  const svg = $('#donut'); if (!svg) return;
  const R = 48, CIRC = 2 * Math.PI * R;
  const sorted = [...C.hs].sort((a, b) => b.value - a.value);
  const top = sorted.slice(0, PAL.length), rest = sorted.slice(PAL.length);
  const segs = top.map(h => ({ label: h.symbol, v: h.cur, c: colorOf[h.symbol] }));
  if (rest.length) segs.push({ label: `อื่นๆ (${rest.length})`, v: rest.reduce((a, h) => a + h.cur, 0), c: OTHER });
  svg.innerHTML = `<circle cx="60" cy="60" r="${R}" stroke="var(--surface2)"/>` + segs.map((s, i) =>
    `<circle data-i="${i}" cx="60" cy="60" r="${R}" stroke="${s.c}" stroke-linecap="butt" stroke-dasharray="0 ${CIRC}" stroke-dashoffset="0"/>`).join('');
  let off = 0; const circles = $$('circle[data-i]', svg);
  requestAnimationFrame(() => requestAnimationFrame(() => segs.forEach((s, i) => {
    const len = Math.max(0, s.v * CIRC - 2.2);
    circles[i].style.strokeDasharray = `${len} ${CIRC - len}`; circles[i].style.strokeDashoffset = -off; off += s.v * CIRC;
  })));
  $('#legend').innerHTML = segs.map((s, i) => `<div class="lg" data-i="${i}"><i style="background:${s.c}"></i><span>${s.label}</span><em class="num">${pct(s.v)}</em></div>`).join('');
  const hi = i => {
    circles.forEach((c, j) => c.classList.toggle('dim', i >= 0 && j !== i));
    $$('.lg').forEach((l, j) => l.classList.toggle('dim', i >= 0 && j !== i));
    $('#d-mid').textContent = i >= 0 ? pct(segs[i].v) : C.hs.length; $('#d-sub').textContent = i >= 0 ? segs[i].label : 'สินทรัพย์';
  };
  const bind = el => { el.addEventListener('pointerenter', () => hi(+el.dataset.i)); el.addEventListener('pointerleave', () => hi(-1));
    el.addEventListener('click', e => { e.stopPropagation(); const i = +el.dataset.i; if (segs[i] && top[i]) openSheet(top[i].symbol); }); };
  $$('circle[data-i]', svg).forEach(bind); $$('.lg').forEach(bind);
}

/* ---------- render / navigation ---------- */
const view = $('#view');
function growBars(root) {
  requestAnimationFrame(() => requestAnimationFrame(() => $$('.fill[data-w]', root).forEach(f => f.style.width = f.dataset.w + '%')));
}
function render(dir = 'n') {
  view.className = 'view enter-' + dir;
  view.innerHTML = V[S.tab]();
  view.scrollTop = 0;
  countUp(view); growBars(view); if (S.tab === 'home') drawDonut();
  $('#hello-sub').textContent = TITLES[S.tab][0]; $('#hello-title').textContent = TITLES[S.tab][1];
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  $('#nav .ind').style.transform = `translateX(${TABS.indexOf(S.tab) * 100}%)`;
  $('#btn-cur').textContent = S.cur;
}
function go(tab, opts = {}) {
  if (tab === S.tab && !opts.force) return;
  const dir = TABS.indexOf(tab) > TABS.indexOf(S.tab) ? 'r' : 'l';
  S.tab = tab; if (opts.filter) S.filter = opts.filter;
  try { navigator.vibrate && navigator.vibrate(8); } catch {}
  render(opts.force ? 'n' : dir);
}
// สลับ view แบบไม่ re-animate ทั้งหน้า (ใช้กับ slider)
function refreshSim() {
  const { rows, add } = allocate(S.sim);
  const list = [...rows].sort((a, b) => b.buyUsd - a.buyUsd || b.gap2 - a.gap2);
  $('#sim-amt').textContent = thb(S.sim); $('#sim-usd').textContent = usd(add);
  $('#sim').style.setProperty('--p', (S.sim / 30000 * 100) + '%');
  $('#sim-list').innerHTML = simRows(list);
  $$('#sim-list .fill').forEach(f => f.style.width = f.dataset.w + '%');
}

/* ---------- events (delegation) ---------- */
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });
view.addEventListener('click', e => {
  const t = e.target;
  const g = t.closest('[data-go]'); if (g) return go(g.dataset.go, { filter: g.dataset.f });
  const f = t.closest('[data-filter]'); if (f) { S.filter = f.dataset.filter; return render('n'); }
  const sg = t.closest('[data-seg]'); if (sg) { S.seg = sg.dataset.seg; return render('n'); }
  const q = t.closest('[data-q]'); if (q) { S.sim = +q.dataset.q; $('#sim').value = S.sim; return refreshSim(); }
  const s = t.closest('[data-sym]'); if (s) openSheet(s.dataset.sym);
});
view.addEventListener('input', e => { if (e.target.id === 'sim') { S.sim = +e.target.value; refreshSim(); } });
view.addEventListener('transitionend', () => {}, { passive: true });
const observer = new MutationObserver(() => { const r = $('#sim'); if (r) r.style.setProperty('--p', (S.sim / 30000 * 100) + '%'); });
observer.observe(view, { childList: true });

$('#btn-cur').addEventListener('click', () => { S.cur = S.cur === 'THB' ? 'USD' : 'THB'; store.set('cur', S.cur); render('n'); toast('แสดงเป็น ' + S.cur); });
function applyHide() { document.body.classList.toggle('hide', S.hide); $('#btn-eye').classList.toggle('on', S.hide); }
$('#btn-eye').addEventListener('click', () => { S.hide = !S.hide; store.set('hide', S.hide ? '1' : '0'); applyHide(); toast(S.hide ? 'ซ่อนตัวเลขแล้ว' : 'แสดงตัวเลขแล้ว'); });
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1500); }

    <div class="grid2">
      <div><small>จำนวนหุ้น</small><b class="num">${nf(h.shares, 6)}</b></div>
      <div><small>ราคาล่าสุด</small><b class="num">${usd(h.price)}</b></div>
      <div><small>ต้นทุนเฉลี่ย</small><b class="num">${usd(avg)}</b></div>
      <div><small>ต้นทุนรวม</small><b class="num">${fmtMoney(h.costUsd)}</b></div>
      <div><small>ขาดถึงเป้า</small><b class="num">${fmtMoney(h.gap)}</b></div>
      <div><small>ส่วนต่างสัดส่วน</small><b class="num ${h.cur >= h.target ? 'neg' : 'pos'}">${(h.cur >= h.target ? '+' : '−') + pct(Math.abs(h.cur - h.target), 2)}</b></div>
    </div>
    <h3 style="margin:18px 0 4px;font-size:13px;color:var(--muted)">ประวัติการซื้อ ${h.trades.length} รายการ</h3>
    ${h.trades.map(t => `<div class="row"><div class="dot b" style="width:36px;height:36px;font-size:15px">↙</div>
      <div class="r-main"><b style="font-size:14px">${dateTh(t.date)}</b><small>${nf(t.shares, 4)} @ ${usd(t.price)}</small></div>
      <div class="r-side"><b style="font-size:14px">${usd(t.net)}</b></div></div>`).join('')}`;
  countUp(sbody);
  scrim.classList.add('open'); sheet.style.transform = ''; sheet.classList.add('open');
  sbody.scrollTop = 0; growBars(sbody);
  try { navigator.vibrate && navigator.vibrate(8); } catch {}
}
function closeSheet() { scrim.classList.remove('open'); sheet.classList.remove('open'); sheet.style.transform = ''; }
scrim.addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
(() => { // ลากลงเพื่อปิด
  const grab = $('.grab', sheet); let y0 = 0, dy = 0, on = false;
  const down = e => { on = true; y0 = e.clientY; dy = 0; sheet.classList.add('drag'); grab.setPointerCapture(e.pointerId); };
  const move = e => { if (!on) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; };
  const up = () => { if (!on) return; on = false; sheet.classList.remove('drag'); if (dy > 110) closeSheet(); else sheet.style.transform = ''; };
  grab.addEventListener('pointerdown', down); grab.addEventListener('pointermove', move); grab.addEventListener('pointerup', up); grab.addEventListener('pointercancel', up);
})();

/* ---------- swipe ระหว่างแท็บ + pull to refresh ---------- */
(() => {
  let x0 = 0, y0 = 0, active = false, pulling = false, pull = 0;
  const ptr = $('#ptr');
  view.addEventListener('touchstart', e => {
    const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; active = true; pulling = view.scrollTop <= 0; pull = 0;
  }, { passive: true });
  view.addEventListener('touchmove', e => {
    if (!active) return; const t = e.touches[0], dy = t.clientY - y0, dx = t.clientX - x0;
    if (pulling && dy > 0 && Math.abs(dy) > Math.abs(dx)) {
      pull = Math.min(dy * .5, 90); ptr.style.opacity = Math.min(1, pull / 50);
      ptr.style.transform = `translateY(${pull}px) scale(${.6 + Math.min(.4, pull / 150)}) rotate(${pull * 4}deg)`;
    }
  }, { passive: true });
  view.addEventListener('touchend', e => {
    if (!active) return; active = false; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (pull > 60) { // รีเฟรช
      ptr.classList.add('spin'); ptr.style.transform = 'translateY(50px) scale(1)';
      setTimeout(() => { ptr.classList.remove('spin'); ptr.style.opacity = 0; ptr.style.transform = ''; refresh(); }, 700);
    } else { ptr.style.opacity = 0; ptr.style.transform = ''; }
    pull = 0;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50 && !e.target.closest('.filters')) {
      const i = TABS.indexOf(S.tab) + (dx < 0 ? 1 : -1); if (TABS[i]) go(TABS[i]);
    }
  }, { passive: true });
})();

/* ---------- เพิ่มรายการ (เขียนลง Supabase) ---------- */
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
let formKind = 'trade';
const FORMS = {
  trade: () => `
    <label>วันที่<input class="inp" name="trade_date" type="date" value="${today()}" required></label>
    <label>หุ้น<input class="inp" name="symbol" list="syms" autocapitalize="characters" placeholder="เช่น IVV" required><datalist id="syms">${D.holdings.map(h => `<option value="${h.symbol}">`).join('')}</datalist></label>
    <label>ประเภท<select class="inp" name="action"><option>BUY</option><option>SELL</option></select></label>
    <label>จำนวนหุ้น<input class="inp" name="shares" type="number" step="any" min="0" inputmode="decimal" required></label>
    <label>ราคา (USD)<input class="inp" name="price_usd" type="number" step="any" min="0" inputmode="decimal" required></label>
    <label>ค่าธรรมเนียม (USD)<input class="inp" name="fees_usd" type="number" step="any" min="0" value="0" inputmode="decimal"></label>
    <label>FX THB/USD<input class="inp" name="fx" type="number" step="any" value="${FX}" inputmode="decimal" required></label>
    <label>ต้นทุน USD (เฉพาะ SELL)<input class="inp" name="cost_basis_usd" type="number" step="any" inputmode="decimal"></label>
    <label class="full">หมายเหตุ<input class="inp" name="notes" type="text"></label>
    <div class="note full">จำนวนหุ้น = 0 คือการอัปเดต “ราคาล่าสุด” ของหุ้นตัวนั้นโดยไม่ซื้อขาย (เหมือนที่ทำใน Excel)</div>`,
  cash: () => `
    <label>วันที่<input class="inp" name="flow_date" type="date" value="${today()}" required></label>
    <label>ประเภท<select class="inp" name="type"><option>FX Exchange</option><option>Funding</option><option>Remittance to Thailand</option><option>Other</option></select></label>
    <label>จำนวน THB<input class="inp" name="thb_amount" type="number" step="any" inputmode="decimal"></label>
    <label>จำนวน USD<input class="inp" name="usd_amount" type="number" step="any" inputmode="decimal"></label>
    <label>ทิศทาง<select class="inp" name="direction"><option>THB-USD</option><option>USD-THB</option><option value="">—</option></select></label>
    <label class="full">หมายเหตุ<input class="inp" name="notes" type="text"></label>`,
  div: () => `
    <label>วันที่<input class="inp" name="div_date" type="date" value="${today()}" required></label>
    <label>หุ้น<input class="inp" name="symbol" list="syms" autocapitalize="characters" required><datalist id="syms">${D.holdings.map(h => `<option value="${h.symbol}">`).join('')}</datalist></label>
    <label>ปันผลรวม (USD)<input class="inp" name="gross_usd" type="number" step="any" min="0" inputmode="decimal" required></label>
    <label>ภาษีที่ถูกหัก (USD)<input class="inp" name="tax_usd" type="number" step="any" min="0" value="0" inputmode="decimal"></label>
    <label>FX THB/USD<input class="inp" name="fx" type="number" step="any" value="${FX}" inputmode="decimal" required></label>
    <label class="full">หมายเหตุ<input class="inp" name="notes" type="text"></label>`
};
const TABLE = { trade: 'dime_trades', cash: 'dime_cashflow', div: 'dime_dividends' };
function openForm(kind) {
  formKind = kind || formKind;
  const ks = [['trade', 'ซื้อขาย'], ['cash', 'เงินเข้า/ออก'], ['div', 'ปันผล']], idx = ks.findIndex(k => k[0] === formKind);
  sbody.innerHTML = `
    <h2 style="margin:4px 0 14px;font-size:20px">เพิ่มรายการ</h2>
    <div class="seg" style="margin-bottom:12px"><div class="thumb" style="width:calc((100% - 8px)/3);transform:translateX(${idx * 100}%)"></div>
      ${ks.map(k => `<button type="button" class="${k[0] === formKind ? 'on' : ''}" data-fk="${k[0]}">${k[1]}</button>`).join('')}</div>
    <form id="addform" class="form">${FORMS[formKind]()}<button class="btn full" type="submit">บันทึก</button></form>`;
  $$('[data-fk]', sbody).forEach(b => b.addEventListener('click', () => openForm(b.dataset.fk)));
  $('#addform').addEventListener('submit', async e => {
    e.preventDefault(); const btn = $('.btn', e.target); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    const row = {}; new FormData(e.target).forEach((v, k) => { v = String(v).trim(); row[k] = v === '' ? null : v; });
    ['shares', 'price_usd', 'fees_usd', 'fx', 'cost_basis_usd', 'thb_amount', 'usd_amount', 'gross_usd', 'tax_usd'].forEach(k => { if (row[k] != null) row[k] = +row[k]; });
    if (row.symbol) row.symbol = row.symbol.toUpperCase();
    if (formKind === 'trade' && row.action !== 'SELL') row.cost_basis_usd = null;
    try { await api.insert(TABLE[formKind], row); closeSheet(); await refresh(); toast('บันทึกแล้ว ✓'); }
    catch (err) { btn.disabled = false; btn.textContent = 'บันทึก'; toast('ผิดพลาด: ' + (err.message || err)); }
  });
  if (!sheet.classList.contains('open')) { scrim.classList.add('open'); sheet.style.transform = ''; sheet.classList.add('open'); }
  sbody.scrollTop = 0;
}
async function refresh() {
  if (api && api.load) { try { setData(await api.load()); } catch (err) { toast('โหลดไม่สำเร็จ: ' + (err.message || err)); return; } }
  render('n'); toast('อัปเดตแล้ว');
}
if (api) {
  $('#fab').hidden = false; $('#btn-out').hidden = false;
  $('#fab').addEventListener('click', () => openForm(S.tab === 'activity' ? ({ trades: 'trade', cash: 'cash', div: 'div' })[S.seg] : 'trade'));
  $('#btn-out').addEventListener('click', () => api.signOut());
}

/* ---------- boot ---------- */
applyHide();
render('n');
setTimeout(() => $('#splash').classList.add('out'), reduced ? 100 : 1300);
return { reload: nd => { setData(nd); render('n'); } };
};

</script>
<script>
/* เชื่อม Supabase: login → โหลดตาราง dime_* → สร้างข้อมูลรูปแบบเดียวกับ Excel → startApp */
(() => {
  const $ = s => document.querySelector(s);
  const cfg = window.DIME_CONFIG;
  const sb = window.supabase.createClient(cfg.url, cfg.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const n = v => (v == null ? 0 : +v);
  const yr = d => +String(d).slice(0, 4);
  let app = null;

  async function load() {
    const q = t => sb.from(t).select('*').limit(5000);
    const [st, hd, tr, cf, dv] = await Promise.all([q('dime_settings'), q('dime_holdings'), q('dime_trades'), q('dime_cashflow'), q('dime_dividends')]);
    for (const r of [st, hd, tr, cf, dv]) if (r.error) throw r.error;
    const set = st.data[0] || {};
    // เรียงตามเวลาที่บันทึกจริง (วันที่ แล้วตาม id) เพื่อหา "ราคาล่าสุด" เหมือน XLOOKUP ใน Excel
    const asc = [...tr.data].sort((a, b) => a.trade_date.localeCompare(b.trade_date) || a.id - b.id);
    const shares = {}, price = {};
    asc.forEach(t => { shares[t.symbol] = (shares[t.symbol] || 0) + (t.action === 'SELL' ? -1 : 1) * n(t.shares); price[t.symbol] = n(t.price_usd); });
    const trades = [...asc].reverse().map(t => ({ date: t.trade_date, symbol: t.symbol, action: t.action, shares: n(t.shares), price: n(t.price_usd),
      gross: n(t.gross_usd), fees: n(t.fees_usd), net: n(t.net_usd), fx: n(t.fx), netThb: n(t.net_thb), gainThb: n(t.realized_thb), note: t.notes || '' }));
    const cashflow = cf.data.map(c => ({ date: c.flow_date, type: c.type, thb: n(c.thb_amount), usd: n(c.usd_amount), fx: n(c.fx), direction: c.direction || '', note: c.notes || '' }))
      .sort((a, b) => b.date.localeCompare(a.date));
    const dividends = dv.data.map(d => ({ date: d.div_date, symbol: d.symbol, grossUsd: n(d.gross_usd), taxUsd: n(d.tax_usd), netUsd: n(d.net_usd), fx: n(d.fx),
      grossThb: n(d.gross_thb), taxThb: n(d.tax_thb), netThb: n(d.net_thb) })).sort((a, b) => b.date.localeCompare(a.date));
    const years = new Set(Array.from({ length: 10 }, (_, i) => 2026 + i));
    [...trades, ...cashflow, ...dividends].forEach(x => years.add(yr(x.date)));
    const inY = (arr, y) => arr.filter(x => yr(x.date) === y);
    const sum = (arr, k) => arr.reduce((a, x) => a + x[k], 0);
    const tax = [...years].sort().map(y => ({ year: y, realizedThb: sum(inY(trades, y), 'gainThb'), grossDivThb: sum(inY(dividends, y), 'grossThb'),
      foreignTaxThb: sum(inY(dividends, y), 'taxThb'), netDivThb: sum(inY(dividends, y), 'netThb'),
      remitThb: sum(inY(cashflow, y).filter(c => c.type === 'Remittance to Thailand'), 'thb'), fundingThb: sum(inY(cashflow, y).filter(c => c.type === 'Funding'), 'thb') }));
    return { updated: new Date().toISOString().slice(0, 10), fx: n(set.fx) || 33, contributionThb: n(set.contribution_thb),
      holdings: hd.data.map(h => ({ symbol: h.symbol, target: n(h.target), shares: shares[h.symbol] || 0, price: price[h.symbol] || 0 })), trades, cashflow, dividends, tax };
  }
  const api = {
    load,
    async insert(table, row) { const { error } = await sb.from(table).insert(row); if (error) throw error; },
    async signOut() { await sb.auth.signOut(); location.reload(); }
  };

  async function enter() {
    $('#login').hidden = true;
    try {
      const data = await load();
      if (app) app.reload(data); else app = window.startApp(data, api);
    } catch (e) {
      $('#login').hidden = false; const el = $('#login-err'); el.hidden = false;
      el.textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + (e.message || e) + ' — ตรวจว่ารัน supabase/schema.sql แล้ว';
      document.getElementById('splash').classList.add('out');
    }
  }
  $('#loginform').addEventListener('submit', async e => {
    e.preventDefault(); const f = new FormData(e.target), err = $('#login-err'), btn = $('.btn', e.target);
    btn.disabled = true; err.hidden = true;
    const { error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
    btn.disabled = false;
    if (error) { err.hidden = false; err.textContent = error.message === 'Invalid login credentials' ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : error.message; return; }
    enter();
  });
  sb.auth.getSession().then(({ data }) => {
    if (data.session) enter(); else { $('#login').hidden = false; $('#splash').classList.add('out'); }
  });
})();

</script>
