<style>
/* ===== K FINANCE — Black & Red, mobile-app feel ===== */
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{
  --bg:#050506; --s1:#0e0e11; --s2:#16161a; --s3:#212126;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#f6f6f8; --muted:#9b9ba7; --faint:#5c5c68;
  --red:#ff2d46; --red2:#ff6a3d; --redd:#6d1220;
  --accent:#ff2d46; --buy:#ff2d46; --hold:#8d8d99; --watch:#ffb547; --up:#34d399; --down:#ff6b7a;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  --nav-h:74px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Inter','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;background:#000;color:var(--text);
  -webkit-font-smoothing:antialiased;overflow:hidden;display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.015em}

/* ---- shell ---- */
#app{position:relative;width:100%;height:100dvh;max-width:430px;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(120% 55% at 50% -8%,#2a0810 0%,transparent 60%),radial-gradient(80% 40% at 100% 100%,#1c0509 0%,transparent 60%),var(--bg)}
@media (min-width:600px){#app{height:min(900px,calc(100dvh - 32px));border-radius:46px;
  box-shadow:0 0 0 10px #0a0a0c,0 0 0 11px rgba(255,255,255,.1),0 40px 100px rgba(255,45,70,.12),0 40px 90px rgba(0,0,0,.7)}}

/* splash */
#splash{position:absolute;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .6s ease .1s,visibility .7s,transform .7s var(--ease)}
#splash.out{opacity:0;visibility:hidden;transform:scale(1.06)}
.logo{width:78px;height:78px;border-radius:24px;background:linear-gradient(145deg,#ff2d46,#ff6a3d);display:grid;place-items:center;
  box-shadow:0 14px 50px rgba(255,45,70,.5);animation:pop .9s var(--spring) both}
.logo svg{width:40px;height:40px}
.splash-t{font-weight:700;letter-spacing:.22em;font-size:12px;color:var(--muted);animation:rise .7s .25s var(--ease) both}
.splash-bar{width:120px;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.splash-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2));transform:translateX(-100%);animation:load 1.1s .2s var(--ease) forwards}
@keyframes load{to{transform:none}}
@keyframes pop{from{transform:scale(.3) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}

/* ---- header ---- */
header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:max(env(safe-area-inset-top),18px) 18px 8px;position:relative;z-index:5}
.hello small{display:block;color:var(--muted);font-size:12px}
.hello b{font-size:21px;letter-spacing:-.02em;display:block}
.tools{display:flex;gap:8px}
.icon-btn{height:38px;min-width:38px;padding:0 11px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);backdrop-filter:blur(10px);
  transition:transform .35s var(--spring),background .25s,color .25s}
.icon-btn:active{transform:scale(.86)}
.icon-btn.on{background:var(--red);color:#fff;border-color:transparent}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- views ---- */
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:6px 16px calc(var(--nav-h) + 34px);scrollbar-width:none;overscroll-behavior-y:contain}
.view::-webkit-scrollbar{display:none}
.view.enter-r{animation:inR .55s var(--ease) both}.view.enter-l{animation:inL .55s var(--ease) both}.view.enter-n{animation:fade .35s ease both}
@keyframes inR{from{opacity:0;transform:translateX(40px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rise{animation:rise .7s var(--ease) backwards;animation-delay:calc(var(--i,0)*75ms + 40ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
#ptr{position:absolute;top:-6px;left:50%;width:36px;height:36px;margin-left:-18px;border-radius:50%;z-index:4;background:var(--s2);border:1px solid var(--line2);
  display:grid;place-items:center;opacity:0;transform:scale(.6);pointer-events:none}
#ptr svg{width:16px;height:16px;stroke:var(--red);fill:none;stroke-width:2.4;stroke-linecap:round}
#ptr.spin svg{animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* ---- cards ---- */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),var(--s1);border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.card h3{margin:0 0 14px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card h3 a{color:var(--red);font-weight:600;cursor:pointer;letter-spacing:0;text-transform:none;font-size:13px}
.glow{position:relative}
.glow::before{content:"";position:absolute;inset:-1px;border-radius:27px;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--a),transparent 0 62%,var(--red) 82%,var(--red2) 92%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 5s linear infinite}
@keyframes rot{to{--a:360deg}}
.hero{border:0;overflow:hidden;color:#fff;background:linear-gradient(155deg,#43091a 0%,#1f070d 52%,#0d0507 100%);box-shadow:0 20px 60px rgba(255,45,70,.16)}
.hero .blob{position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none;animation:float 10s ease-in-out infinite}
.hero .b1{width:200px;height:200px;background:#ff2d46;right:-70px;top:-80px;opacity:.4}
.hero .b2{width:160px;height:160px;background:#ff6a3d;left:-60px;bottom:-70px;opacity:.28;animation-delay:-5s}
@keyframes float{50%{transform:translate(24px,18px) scale(1.18)}}
.hero>*:not(.blob){position:relative;z-index:1}
.lbl{font-size:12px;color:rgba(255,255,255,.68);letter-spacing:.05em}
.big{font-size:40px;font-weight:800;letter-spacing:-.035em;margin:6px 0 10px;line-height:1.05}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12)}
.chip.up{color:#6df0b4;background:rgba(52,211,153,.15)}.chip.down{color:#ff8a9b;background:rgba(255,107,122,.16)}
.amt{transition:filter .4s var(--ease)}body.hide .amt{user-select:none}
.sub2,.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;font-size:12px;color:rgba(255,255,255,.68);margin-top:12px}
.meta .pos{color:#6df0b4!important}.meta .neg{color:#ff8a9b!important}

/* hero extras: ledger / split / progress */
.rule2{display:none}
.ledger{display:grid;gap:9px;margin-top:6px}
.lrow{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:12px}
.lrow>span{font-size:12px;color:rgba(255,255,255,.68)}
.lrow b{font-size:13.5px;font-weight:700;min-width:90px;text-align:right}
.lbar{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
.lbar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#fff,#ffd0bd);transition:width 1.2s var(--ease)}
.lrow.debt .lbar i{background:linear-gradient(90deg,#ff2d46,#ff6a3d)}.lrow.debt b{color:#ff8a9b}
.split{display:flex;gap:3px;height:10px;margin:16px 0 8px}
.split i{display:block;height:100%;border-radius:6px;width:0;transition:width 1.2s var(--ease)}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:rgba(255,255,255,.7)}
.keys span{display:inline-flex;align-items:center;gap:5px}.keys b{width:8px;height:8px;border-radius:3px;display:inline-block}
.prog{height:9px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#ff2d46,#ff6a3d);transition:width 1.3s var(--ease)}

/* rings */
.ring{transform:rotate(-90deg);display:block}
.ring .trk{fill:none;stroke:var(--s3)}
.ring .arc{fill:none;stroke-linecap:round;transition:stroke-dasharray 1.4s var(--ease);filter:drop-shadow(0 0 7px rgba(255,45,70,.55))}
.ringwrap{position:relative;display:grid;place-items:center;flex:none}
.ringwrap .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringwrap .mid b{font-size:26px;letter-spacing:-.03em;line-height:1}.ringwrap .mid small{font-size:11px;color:var(--muted);margin-top:3px}
.score{display:flex;gap:18px;align-items:center;margin-bottom:8px}
.score .g{font-size:20px;font-weight:800;letter-spacing:-.02em}.score .d{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.5}

/* grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),var(--s1);border:1px solid var(--line);border-radius:22px;padding:15px 14px;
  text-align:left;transition:transform .4s var(--spring),border-color .3s;overflow:hidden;display:flex;flex-direction:column;gap:3px;min-height:112px}
.tile:active{transform:scale(.95)}
.tile small{color:var(--muted);font-size:11.5px;display:flex;align-items:center;gap:6px}
.tile b{font-size:20px;letter-spacing:-.025em}.tile .s{font-size:11.5px;color:var(--muted)}
.tile .ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:rgba(255,45,70,.14);color:var(--red);margin-bottom:6px}
.tile .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* donut */
.donut-wrap{display:flex;gap:16px;align-items:center}
.donut{position:relative;width:148px;height:148px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:15;transition:stroke-dasharray 1.2s var(--ease),stroke-dashoffset 1.2s var(--ease),opacity .25s;cursor:pointer}
.donut circle.dim{opacity:.22}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .mid b{font-size:22px;letter-spacing:-.02em}.donut .mid small{color:var(--muted);font-size:11px}
.legend{flex:1;display:grid;gap:7px;min-width:0}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;transition:opacity .2s}
.lg i{width:9px;height:9px;border-radius:3px;flex:none}.lg span{flex:1;font-weight:600}.lg em{font-style:normal;color:var(--muted);font-size:12px}.lg.dim{opacity:.3}

/* pills & rows */
.pill{font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.BUY{background:rgba(255,45,70,.16);color:#ff5a6e}.pill.HOLD{background:rgba(141,141,153,.16);color:var(--hold)}.pill.WATCH{background:rgba(255,181,71,.16);color:var(--watch)}
.pill.ok{background:rgba(52,211,153,.14);color:var(--up)}.pill.bad{background:rgba(255,45,70,.16);color:#ff5a6e}.pill.warn{background:rgba(255,181,71,.16);color:var(--watch)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
button.row{transition:transform .4s var(--spring),opacity .2s}button.row:active{transform:scale(.97);opacity:.85}
.avatar{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:800;font-size:11px;color:#fff;letter-spacing:-.02em}
.r-main{flex:1;min-width:0}
.r-main b{display:flex;align-items:center;gap:8px;font-size:15px}
.r-main small{display:block;color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-side{text-align:right;flex:none}.r-side b{display:block;font-size:15px}.r-side small{font-size:12px;color:var(--muted)}
.pos{color:var(--up)!important}.neg{color:var(--down)!important}
.meter{position:relative;height:7px;border-radius:7px;background:var(--s3);margin-top:8px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;width:0;transition:width 1.1s var(--ease)}
.meter .tgt{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--text);opacity:.6}

/* segmented + chips */
.seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:4px;margin-bottom:14px;position:relative}
.seg button{flex:1;padding:10px 2px;font-size:12.5px;font-weight:600;color:var(--muted);border-radius:14px;position:relative;z-index:1;transition:color .3s;text-align:center;white-space:nowrap}
.seg button.on{color:#fff}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:14px;background:linear-gradient(135deg,var(--red),#d4152e);box-shadow:0 6px 18px rgba(255,45,70,.4);transition:transform .5s var(--spring),width .3s}
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);transition:all .35s var(--spring)}
.fchip:active{transform:scale(.9)}.fchip.on{background:var(--text);color:#000;border-color:var(--text)}
.psub{color:var(--muted);font-size:13px;margin:0 2px 14px}

/* simulator */
.sim-amt{font-size:36px;font-weight:800;letter-spacing:-.03em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:8px 0 2px;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--red) var(--p,0%),var(--s3) var(--p,0%))}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:var(--s3)}input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--red)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 3px 12px rgba(255,45,70,.6);border:5px solid var(--red);transition:transform .25s var(--spring)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid var(--red)}
.quick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.buyline{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-size:13px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.65;background:rgba(255,255,255,.04);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.note b{color:#fff}
.note.warn{background:rgba(255,181,71,.1);color:var(--watch)}.note.warn b{color:var(--watch)}

.dgroup{font-size:12px;color:var(--muted);font-weight:600;margin:16px 4px 6px;letter-spacing:.03em}
.dot{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:18px;font-weight:800}
.dot svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot.b{background:rgba(255,45,70,.14);color:var(--red)}.dot.s{background:rgba(255,107,122,.14);color:var(--down)}
.dot.c{background:rgba(255,255,255,.08);color:#d4d4d8}.dot.d{background:rgba(255,181,71,.14);color:var(--watch)}.dot.g{background:rgba(52,211,153,.14);color:var(--up)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv div small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:3px}.kv div b{font-size:16px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px;line-height:1.7}.empty .e{font-size:34px;display:block;margin-bottom:8px}

/* health checks */
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tick{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--faint)}
.tick svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .8s var(--ease) .5s}
.tick.ok{background:rgba(52,211,153,.15);color:var(--up)}.tick.mid{background:rgba(255,181,71,.15);color:var(--watch)}.tick.bad{background:rgba(255,45,70,.15);color:var(--red)}
.tick.go svg{stroke-dashoffset:0}
.check .t{flex:1;min-width:0}.check .t b{display:block;font-size:14px}.check .t small{color:var(--muted);font-size:12px}
.check .pts{font-size:12px;font-weight:700;color:var(--muted)}

/* ---- nav ---- */
nav{position:absolute;left:12px;right:12px;bottom:max(env(safe-area-inset-bottom),12px);height:64px;z-index:20;border-radius:26px;
  background:rgba(18,18,22,.78);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.6);display:grid;grid-template-columns:repeat(5,1fr);padding:0 6px}
nav .ind{position:absolute;top:7px;bottom:7px;left:6px;width:calc((100% - 12px)/5);border-radius:20px;background:rgba(255,45,70,.14);transition:transform .55s var(--spring)}
nav button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:10.5px;font-weight:600;
  transition:color .3s,transform .35s var(--spring)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .55s var(--spring)}
nav button:active{transform:scale(.86)}
nav button.on{color:var(--red)}nav button.on svg{transform:translateY(-2px) scale(1.15)}
nav .add{align-self:center;justify-self:center;width:52px;height:52px;border-radius:19px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;flex-direction:row;
  box-shadow:0 10px 28px rgba(255,45,70,.55);margin-top:-18px;transition:transform .45s var(--spring)}
nav .add svg{width:26px;height:26px;stroke-width:2.6;transition:transform .5s var(--spring)}
nav .add:active{transform:scale(.88)}nav .add.open svg{transform:rotate(135deg)}

/* ---- sheet ---- */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(4px);z-index:40;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
#scrim.open{opacity:1;visibility:visible}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;z-index:41;background:linear-gradient(180deg,#17171c,#0e0e11);border-radius:32px 32px 0 0;border-top:1px solid var(--line2);
  transform:translateY(106%);transition:transform .6s var(--ease);display:flex;flex-direction:column;box-shadow:0 -24px 70px rgba(0,0,0,.6)}
#sheet.open{transform:none}#sheet.drag{transition:none}
.grab{flex:none;padding:12px 0 6px;touch-action:none;cursor:grab}.grab i{display:block;width:44px;height:5px;border-radius:5px;background:var(--faint);opacity:.6;margin:0 auto}
#sheet-body{overflow-y:auto;padding:4px 20px max(env(safe-area-inset-bottom),24px);scrollbar-width:none}#sheet-body::-webkit-scrollbar{display:none}
.sh-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sh-head .avatar{width:52px;height:52px;border-radius:17px;font-size:13px}
.sh-head h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.sh-title{margin:4px 0 14px;font-size:20px;letter-spacing:-.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.grid2 div{background:rgba(255,255,255,.05);border-radius:16px;padding:12px 14px}.grid2 small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:4px}.grid2 b{font-size:16px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;
  animation:pop2 .6s var(--spring) backwards;animation-delay:calc(var(--i)*45ms + 80ms);transition:transform .35s var(--spring),border-color .3s}
.mi:active{transform:scale(.93)}.mi.hi{border-color:rgba(255,45,70,.5);background:rgba(255,45,70,.1)}
.mi .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:rgba(255,45,70,.15);color:var(--red)}
.mi .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mi b{font-size:14px;display:block}.mi small{color:var(--muted);font-size:11.5px;display:block;margin-top:2px}
@keyframes pop2{from{opacity:0;transform:translateY(16px) scale(.85)}to{opacity:1;transform:none}}

/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:block;font-size:12px;color:var(--muted);font-weight:600}.form .full{grid-column:1/-1}
.inp{display:block;width:100%;margin-top:6px;padding:13px 14px;border-radius:15px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--text);font:inherit;font-size:16px;
  transition:border-color .25s,box-shadow .25s,background .25s;min-width:0;appearance:none;-webkit-appearance:none}
.inp:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 4px rgba(255,45,70,.2);background:rgba(255,255,255,.07)}
select.inp option{background:#16161a}
.btn{position:relative;overflow:hidden;padding:15px;border-radius:18px;background:linear-gradient(135deg,var(--red),#d4152e);color:#fff;font-weight:700;font-size:15px;text-align:center;
  box-shadow:0 10px 26px rgba(255,45,70,.38);transition:transform .35s var(--spring),opacity .2s}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.55}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:none;color:var(--text)}
.pxhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pxform{margin-top:12px;grid-template-columns:1fr 1fr 1fr}
.pxform label small{display:block;font-weight:500;color:var(--faint);font-size:10.5px;margin-top:1px;white-space:nowrap}
.pxform .inp{padding:11px 10px;font-size:15px}
#login{position:absolute;inset:0;z-index:90;background:radial-gradient(100% 50% at 50% 0%,#2a0810,var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px;text-align:center}
#login h1{margin:10px 0 0;font-size:27px;letter-spacing:-.02em}#login p{margin:0 0 14px;color:var(--muted);font-size:14px}#login .form{text-align:left}

/* ripple */
.rip{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.22);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}

/* toast */
#toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-26px) scale(.9);background:#fff;color:#000;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;
  opacity:0;pointer-events:none;z-index:60;transition:all .55s var(--spring);white-space:nowrap;display:flex;gap:8px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast .ok{width:18px;height:18px;border-radius:50%;background:var(--up);display:grid;place-items:center}
#toast .ok svg{width:11px;height:11px;stroke:#000;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20}
#toast.show .ok svg{animation:draw .5s .25s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}

/* rebalance price editor */
.pxlist{margin-top:10px}
.pxrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.pxrow:first-child{border-top:0}
.pxrow .r-main small{font-size:11.5px}
.pxin{width:104px;margin:0;padding:10px 12px;font-size:15px;text-align:right;flex:none}

/* guide */
.gstep{display:flex;gap:12px;margin:0 0 14px}.gstep p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.65}.gstep b{font-size:14.5px}.gstep p b{color:var(--text);font-size:inherit}
.gn{flex:none;width:28px;height:28px;border-radius:10px;background:linear-gradient(135deg,var(--red),var(--red2));display:grid;place-items:center;font-weight:800;font-size:13px;margin-top:1px}
.gh{margin:20px 2px 10px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#guide-body .note b{color:#fff}

.sqlbox{background:#08080a;border:1px solid var(--line2);border-radius:14px;padding:12px;font:11px/1.5 ui-monospace,Menlo,monospace;color:#c9c9d1;max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-word;user-select:all}
button.row .r-main{text-align:left}

.sim-in{font-size:30px;font-weight:800;letter-spacing:-.03em;padding:12px 14px;margin-top:8px}

</style>
</head>

/* ---------- portfolio calc (ตรรกะเดียวกับ Excel) ---------- */
const OV = { px: {}, fx: null };
let FX = D.fx;
let buys = D.trades.filter(t => t.shares > 0);
function calc() {
  const hs = D.holdings.map(h => {
    const price = OV.px[h.symbol] ?? h.price, value = h.shares * price, tr = buys.filter(t => t.symbol === h.symbol);
    const costUsd = tr.reduce((a, t) => a + (t.action === 'SELL' ? -t.net : t.net), 0);
    const costThb = tr.reduce((a, t) => a + (t.action === 'SELL' ? -t.netThb : t.netThb), 0);
    return { ...h, price, saved: h.price, value, costUsd, costThb, trades: tr };
  });
  const total = hs.reduce((a, h) => a + h.value, 0);
  hs.forEach(h => {
    h.cur = total ? h.value / total : 0;
    h.status = h.cur < h.target * .95 ? 'BUY' : h.cur > h.target * 1.2 ? 'WATCH' : 'HOLD';
    h.gap = Math.max(0, h.target * total - h.value);
    h.pl = h.value - h.costUsd; h.plPct = h.costUsd ? h.pl / h.costUsd : 0;
  });
  return { hs, total, costUsd: hs.reduce((a, h) => a + h.costUsd, 0), costThb: hs.reduce((a, h) => a + h.costThb, 0),
    buyN: hs.filter(h => h.status === 'BUY').length, watchN: hs.filter(h => h.status === 'WATCH').length };
}
let C = calc();
const PAL = ['#ff2d46', '#ff7a3d', '#ffb547', '#a78bfa', '#38bdf8', '#34d399'], OTHER = '#52525b';
const colorOf = {};
function recolor() { Object.keys(colorOf).forEach(k => delete colorOf[k]); [...C.hs].sort((a, b) => b.value - a.value).forEach((h, i) => colorOf[h.symbol] = PAL[i] || OTHER); }
recolor();
function setData(nd) { D = nd; FX = OV.fx ?? D.fx; buys = D.trades.filter(t => t.shares > 0); C = calc(); recolor(); }

/* ---------- financial summary ---------- */
const sumBy = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
function fin() {
  const st = D.settings, accs = D.accounts, debts = D.debts.filter(d => d.balance > .005);
  const portThb = C.total * FX, emerg = sumBy(accs.filter(a => a.kind === 'emergency'), a => a.balance), cash = sumBy(accs.filter(a => a.kind !== 'emergency'), a => a.balance);
  const debt = sumBy(debts, d => d.balance), assets = portThb + emerg + cash, net = assets - debt;
  const exp = st.expense, inc = st.income, tm = st.targetMonths, target = exp * tm, months = exp > 0 ? emerg / exp : null;
  const minPay = sumBy(debts, d => d.minPay), dsr = inc > 0 ? minPay / inc : null, sr = inc > 0 ? (inc - exp) / inc : null;

  const checks = [

    { t: 'หนี้ดอกเบี้ยสูง (>15%)', pts: debt <= 0 ? 25 : 25 * (1 - hi / debt), d: hi > 0 ? `${thb(hi)} มีดอกเบี้ยเกิน 15%` : 'ไม่มี' },
    { t: 'อัตราการออม', pts: sr == null ? 0 : 25 * clamp(sr / .2, 0, 1), d: sr == null ? 'ตั้งค่ารายได้/รายจ่ายก่อน' : `เหลือเก็บ ${pct(Math.max(sr, 0), 0)} ของรายได้` }
  ];

  const grade = score >= 80 ? 'แข็งแรงมาก' : score >= 60 ? 'ค่อนข้างดี' : score >= 40 ? 'พอใช้' : 'ควรปรับปรุง';
  const byKind = Object.keys(AK).map(k => ({ k, v: sumBy(accs.filter(a => (AK[a.kind] ? a.kind : 'other') === k), a => a.balance) })).filter(x => x.v !== 0 || accs.some(a => a.kind === x.k));
  return { byKind, portThb, emerg, cash, debt, assets, net, exp, inc, tm, target, months, minPay, dsr, sr, hi, avgRate, checks, score, grade, debts };

/* ---------- formatting ---------- */
const nf = (v, d = 2) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const MASK = '****';
const thb = (v, d = 2) => '฿' + (S.hide ? MASK : nf(v, d)), usd = v => '$' + (S.hide ? MASK : nf(v, 2));
const mu = (u, d = 2) => S.cur === 'THB' ? thb(u * FX, d) : usd(u);         // ค่าตั้งต้นเป็น USD
const mt = (t, d = 2) => S.cur === 'THB' ? thb(t, d) : usd(t / FX);          // ค่าตั้งต้นเป็น THB
const sg = (f, v) => (v < 0 ? '−' : '+') + f(Math.abs(v));
const pct = (v, d = 1) => nf(v * 100, d) + '%';
const dateTh = s => new Date(s + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
const mark = s => s.replace('.', '').slice(0, 4);
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
function fmtK(k, v) {
  switch (k) {
    case 'mu': return mu(v); case 'mt': return mt(v); case 'smu': case 'smt': return S.hide ? MASK : sg(x => (k === 'smu' ? mu(x) : mt(x)), v);
    case 'thb': return thb(v); case 'usd': return usd(v); case 'pct': return pct(v); case 'pct0': return pct(v, 0);
    case 'spct': return sg(x => pct(x, 2), v); case 'int': return String(Math.round(v)); case 'fx': return nf(v, 2); case 'd1': return nf(v, 1);
    default: return String(v);
  }
}
function A(kind, v, extra = '') { return `<span class="amt num" data-k="${kind}" data-v="${v}" ${extra}>${fmtK(kind, v)}</span>`; }
function countUp(root) {
  $$('[data-k]:not([data-odo])', root).forEach(el => {
    const k = el.dataset.k, to = +el.dataset.v;
    if (reduced || !isFinite(to) || to === 0) { el.textContent = fmtK(k, to); return; }
    const t0 = performance.now(), dur = 700;
    const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4); el.textContent = fmtK(k, to * e); if (p < 1) requestAnimationFrame(step); else el.textContent = fmtK(k, to); };
    requestAnimationFrame(step);
  });
}
const RC = 2 * Math.PI * 44;
function ring(p, size = 120, w = 10, color = 'var(--red)') {
  return `<svg class="ring" viewBox="0 0 100 100" width="${size}" height="${size}"><circle class="trk" cx="50" cy="50" r="44" stroke-width="${w}"/><circle class="arc" cx="50" cy="50" r="44" stroke="${color}" stroke-width="${w}" data-p="${clamp(p, 0, 1)}" style="stroke-dasharray:0 ${RC}"/></svg>`;
}
function grow(root) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$('[data-w]', root).forEach(f => f.style.width = f.dataset.w + '%');
    $$('.arc[data-p]', root).forEach(a => a.style.strokeDasharray = `${+a.dataset.p * RC} ${RC}`);
    $$('.tick', root).forEach(t => t.classList.add('go'));
    $$('.split i[data-w]', root).forEach(f => f.style.width = f.dataset.w + '%');
  }));
}
const rise = i => `style="--i:${i}"`;
const hero = (label, kind, v, body = '') => `<section class="card hero glow rise"><div class="blob b1"></div><div class="blob b2"></div><div class="lbl">${label}</div><div class="big num amt" data-k="${kind}" data-v="${v}">${fmtK(kind, v)}</div>${body}</section>`;
function odometer(el) {
  const s = fmtK(el.dataset.k, +el.dataset.v), intDigits = (s.split('.')[0].match(/\d/g) || []).length;
  el.style.fontSize = intDigits <= 4 ? '92px' : intDigits === 5 ? '84px' : intDigits === 6 ? '72px' : intDigits === 7 ? '62px' : '52px';
  if (reduced) { el.textContent = s; return; }

    } else if (ch === '.') { dec = true; out += `<span class="dec">.</span>`; }

  });

  requestAnimationFrame(() => requestAnimationFrame(() => $$('.strip', el).forEach(t => t.style.transform = `translateY(${-(+t.dataset.t) * 10}%)`)));
}

/* ---------- date / debt helpers ---------- */
function daysToDue(day) {
  if (!day) return null;
  const n = new Date(), y = n.getFullYear(), m = n.getMonth(), d = n.getDate(), dim = (yy, mm) => new Date(yy, mm + 1, 0).getDate();
  let t = new Date(y, m, Math.min(day, dim(y, m)));
  if (t < new Date(y, m, d)) t = new Date(y, m + 1, Math.min(day, dim(y, m + 1)));
  return Math.round((t - new Date(y, m, d)) / 864e5);
}
function payoff(B, rate, P) {
  if (B <= 0) return { months: 0, interest: 0 }; if (P <= 0) return { months: null };
  const i = rate / 1200; if (i === 0) return { months: Math.ceil(B / P), interest: 0 };
  if (P <= B * i) return { months: Infinity };
  const n = Math.ceil(-Math.log(1 - i * B / P) / Math.log(1 + i)); return { months: n, interest: Math.max(0, n * P - B) };
}
const fmtMonths = n => n === Infinity ? 'ไม่ลดลง (ผ่อนน้อยกว่าดอกเบี้ย)' : n == null ? 'ยังไม่ได้ตั้งยอดผ่อน' : n >= 12 ? `${Math.floor(n / 12)} ปี ${n % 12} เดือน` : `${n} เดือน`;

    </div>
    <div class="split">${parts.map(p => `<i data-w="${p[1] / tot * 100}" style="background:${p[2]}"></i>`).join('')}</div>
    <div class="keys">${parts.map(p => `<span><b style="background:${p[2]}"></b>${p[0]} ${pct(p[1] / tot, 0)}</span>`).join('') || '<span>ยังไม่มีสินทรัพย์</span>'}</div>`)}

      <span class="s">${F.debt ? `ผ่อน ${thb(F.minPay, 0)}/เดือน` : 'ไม่มีหนี้ 🎉'}</span></button>

      <span class="s">${F.sr != null ? `อัตราออม ${pct(Math.max(F.sr, 0), 0)}` : 'ตั้งค่ารายได้'}</span></button>

function dupes() {
  const out = [];
  DUPSRC.forEach(([kind, table, get, key, label, name]) => {
    const g = {}; get().forEach(t => { const k = key(t).join('|'); (g[k] = g[k] || []).push(t); });
    Object.values(g).filter(x => x.length > 1).forEach(items => { items.sort((a, b) => a.id - b.id); out.push({ kind, table, name, items, label: label(items[0]), date: items[0].date }); });
  });
  return out;
}
function openDupes() {

  if (!ds.length) { openSheet(`<h2 class="sh-title">ตรวจรายการซ้ำ</h2><div class="empty"><span class="e">✅</span>ไม่พบรายการซ้ำ</div>`); return; }
  openSheet(`<h2 class="sh-title">ตรวจรายการซ้ำ</h2>

function allocate(contribThb) {
  const add = contribThb / FX, tot = C.total + add, rows = C.hs.map(h => ({ ...h, gap2: Math.max(0, h.target * tot - h.value) }));
  const sumGap = sumBy(rows, r => r.gap2), scale = sumGap > 0 ? Math.min(1, add / sumGap) : 0;
  rows.forEach(r => { r.buyUsd = r.gap2 * scale; r.buyShares = r.price ? r.buyUsd / r.price : 0; r.after = (r.value + r.buyUsd) / tot; });
  return { rows, add };
}

/* ---------- donut ---------- */
function drawDonut() {
  const svgEl = $('#donut'); if (!svgEl) return;
  const R = 48, CIRC = 2 * Math.PI * R, sorted = [...C.hs].sort((a, b) => b.value - a.value), top = sorted.slice(0, PAL.length), rest = sorted.slice(PAL.length);
  const segs = top.map(h => ({ label: h.symbol, v: h.cur, c: colorOf[h.symbol] })); if (rest.length) segs.push({ label: `อื่นๆ (${rest.length})`, v: sumBy(rest, h => h.cur), c: OTHER });
  svgEl.innerHTML = `<circle cx="60" cy="60" r="${R}" stroke="var(--s3)"/>` + segs.map((s, i) => `<circle data-i="${i}" cx="60" cy="60" r="${R}" stroke="${s.c}" stroke-dasharray="0 ${CIRC}" stroke-dashoffset="0"/>`).join('');
  let off = 0; const cs = $$('circle[data-i]', svgEl);
  requestAnimationFrame(() => requestAnimationFrame(() => segs.forEach((s, i) => { const len = Math.max(0, s.v * CIRC - 2.2); cs[i].style.strokeDasharray = `${len} ${CIRC - len}`; cs[i].style.strokeDashoffset = -off; off += s.v * CIRC; })));
  $('#legend').innerHTML = segs.map((s, i) => `<div class="lg" data-i="${i}"><i style="background:${s.c}"></i><span>${s.label}</span><em class="num">${pct(s.v)}</em></div>`).join('');
  const hi = i => { cs.forEach((c, j) => c.classList.toggle('dim', i >= 0 && j !== i)); $$('.lg').forEach((l, j) => l.classList.toggle('dim', i >= 0 && j !== i));
    $('#d-mid').textContent = i >= 0 ? pct(segs[i].v) : C.hs.length; $('#d-sub').textContent = i >= 0 ? segs[i].label : 'สินทรัพย์'; };
  [...cs, ...$$('.lg')].forEach(el => { el.addEventListener('pointerenter', () => hi(+el.dataset.i)); el.addEventListener('pointerleave', () => hi(-1));
    el.addEventListener('click', e => { e.stopPropagation(); const t = top[+el.dataset.i]; if (t) openHolding(t.symbol); }); });
}

nt generated always as identity primary key,\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  account_id bigint not null references public.dime_accounts(id) on delete cascade,\n  move_date date not null default current_date,\n  amount_thb numeric not null check (amount_thb <> 0),\n  note text,\n  created_at timestamptz not null default now()\n);\n\n-- \u0e2b\u0e19\u0e35\u0e49\u0e2a\u0e34\u0e19\ncreate table if not exists public.dime_debts (\n  id bigint generated always as identity primary key,\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  name text not null,\n  kind text not null default 'other' check (kind in ('credit_card','personal_loan','car','home','student','other')),\n  principal_thb numeric not null check (principal_thb >= 0),\n  interest_rate numeric not null default 0 check (interest_rate >= 0),   -- % \u0e15\u0e48\u0e2d\u0e1b\u0e35\n  min_payment_thb numeric not null default 0 check (min_payment_thb >= 0), -- \u0e1c\u0e48\u0e2d\u0e19\u0e02\u0e31\u0e49\u0e19\u0e15\u0e48\u0e33\u0e15\u0e48\u0e2d\u0e40\u0e14\u0e37\u0e2d\u0e19\n  due_day int check (due_day between 1 and 31),\n  started_on date,\n  note text,\n  created_at timestamptz not null default now()\n);\n\n-- \u0e01\u0e32\u0e23\u0e08\u0e48\u0e32\u0e22\u0e2b\u0e19\u0e35\u0e49 (\u0e04\u0e48\u0e32\u0e1a\u0e27\u0e01 = \u0e25\u0e14\u0e22\u0e2d\u0e14\u0e2b\u0e19\u0e35\u0e49, \u0e04\u0e48\u0e32\u0e25\u0e1a = \u0e22\u0e2d\u0e14\u0e2b\u0e19\u0e35\u0e49\u0e40\u0e1e\u0e34\u0e48\u0e21/\u0e14\u0e2d\u0e01\u0e40\u0e1a\u0e35\u0e49\u0e22\u0e17\u0e1a) \u2014 \u0e22\u0e2d\u0e14\u0e04\u0e07\u0e40\u0e2b\u0e25\u0e37\u0e2d = \u0e40\u0e07\u0e34\u0e19\u0e15\u0e49\u0e19 - \u0e1c\u0e25\u0e23\u0e27\u0e21\u0e01\u0e32\u0e23\u0e08\u0e48\u0e32\u0e22\ncreate table if not exists public.dime_debt_payments (\n  id bigint generated always as identity primary key,\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  debt_id bigint not null references public.dime_debts(id) on delete cascade,\n  pay_date date not null default current_date,\n  amount_thb numeric not null check (amount_thb <> 0),\n  note text,\n  created_at timestamptz not null default now()\n);\n\ncreate index if not exists dime_moves_user_idx    on public.dime_account_moves(user_id, account_id, move_date);\ncreate index if not exists dime_payments_user_idx on public.dime_debt_payments(user_id, debt_id, pay_date);\n\ndo $$\ndeclare t text;\nbegin\n  foreach t in array array['dime_accounts','dime_account_moves','dime_debts','dime_debt_payments'] loop\n    execute format('alter table public.%I enable row level security', t);\n    execute format('drop policy if exists \"owner only\" on public.%I', t);\n    execute format('create policy \"owner only\" on public.%I for all to authenticated using (auth.uid() = user_id) with check (auth.uid() = user_id)', t);\n    execute format('revoke all on public.%I from anon', t);\n  end loop;\nend $$;\n\n-- K FINANCE v3 \u2014 \u0e40\u0e1e\u0e34\u0e48\u0e21\u0e2b\u0e21\u0e27\u0e14\u0e40\u0e07\u0e34\u0e19\u0e40\u0e01\u0e47\u0e1a (\u0e40\u0e07\u0e34\u0e19\u0e2d\u0e2d\u0e21/\u0e40\u0e07\u0e34\u0e19\u0e1d\u0e32\u0e01\u0e1b\u0e23\u0e30\u0e08\u0e33/\u0e40\u0e07\u0e34\u0e19\u0e40\u0e1b\u0e49\u0e32\u0e2b\u0e21\u0e32\u0e22/\u0e40\u0e07\u0e34\u0e19\u0e2a\u0e14/\u0e2d\u0e37\u0e48\u0e19\u0e46) \u2014 \u0e23\u0e31\u0e19\u0e43\u0e19 SQL Editor \u0e23\u0e31\u0e19\u0e0b\u0e49\u0e33\u0e44\u0e14\u0e49\nalter table public.dime_accounts drop constraint if exists dime_accounts_kind_check;\nalter table public.dime_accounts add constraint dime_accounts_kind_check\n  check (kind in ('emergency','saving','fixed','goal','cash','other'));\n";

  $('#addform').addEventListener('submit', async e => {
    e.preventDefault(); const btn = $('.btn', e.target); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    const row = {}; new FormData(e.target).forEach((v, k) => { v = String(v).trim(); row[k] = v === '' ? null : v; });
    fields.filter(f => f.type === 'number').forEach(f => { row[f.name] = row[f.name] == null ? null : +row[f.name]; });
    try {
      if (F.prep) await F.prep(row);
      if (editing) { await api.update(F.table, o.edit, F.map ? F.map(row) : row); await done('แก้ไขแล้ว'); }
      else { await F.run(row); await done('บันทึกแล้ว'); }
    } catch (err) { btn.disabled = false; btn.textContent = 'บันทึก'; toast(errMsg(err), false); }
  });
}
function openHoldings() {
  if (!D.holdings.length && false) return;
  const row = h => `<div class="pxrow" data-hrow="${h.id}"><div class="avatar" style="background:${colorOf[h.symbol] || OTHER};width:36px;height:36px;border-radius:12px;font-size:10px">${mark(h.symbol)}</div>
    <div class="r-main"><b style="font-size:14px">${h.symbol}</b><small>${h.shares ? 'ถือ ' + nf(h.shares, 4) + ' หุ้น' : 'ยังไม่ได้ถือ'}</small></div>
    <input class="inp pxin" style="width:78px" data-ht="${h.id}" type="number" step="any" inputmode="decimal" value="${+(h.target * 100).toFixed(4)}" aria-label="เป้า % ${h.symbol}"><span style="color:var(--muted)">%</span>
    <button class="icon-btn" data-hdel="${h.id}" aria-label="ลบ ${h.symbol}" style="color:var(--down)">✕</button></div>`;
  openSheet(`<h2 class="sh-title">จัดการหุ้นในพอร์ต</h2>
    <div class="note">ตั้งสัดส่วนเป้าหมาย (%) ของแต่ละหุ้น ผลรวมควรเป็น 100% · ลบหุ้นออกจากรายการเฝ้าพอร์ตได้ (ประวัติซื้อขายเดิมไม่ถูกลบ)</div>
    <div id="hlist">${D.holdings.map(row).join('') || '<div class="empty">ยังไม่มีหุ้น</div>'}</div>
    <div style="display:flex;justify-content:space-between;margin:10px 2px;font-size:13px"><span style="color:var(--muted)">ผลรวมเป้าหมาย</span><b id="htotal" class="num"></b></div>
    <button class="btn" style="width:100%;margin-bottom:16px" id="hsave">บันทึกเป้าหมาย</button>
    <h3 class="gh">เพิ่มหุ้นใหม่</h3>
    <div class="form"><label>ชื่อหุ้น<input class="inp" id="hn-sym" autocapitalize="characters" placeholder="เช่น AAPL"></label><label>เป้า %<input class="inp" id="hn-t" type="number" step="any" inputmode="decimal" placeholder="0"></label>
      <button class="btn ghost full" id="hadd" type="button">+ เพิ่มหุ้น</button></div>`);
  $('#add').classList.remove('open');
  const tot = () => { const v = $$('[data-ht]', sbody).reduce((s, i) => s + (parseFloat(i.value) || 0), 0); const el = $('#htotal'); if (!el) return; el.textContent = nf(v, 2) + '%'; el.style.color = Math.abs(v - 100) < .01 ? 'var(--up)' : 'var(--watch)'; };
  tot(); sbody.addEventListener('input', tot);
  const fin2 = async m => { await refresh(true); toast(m); openHoldings(); };
  $('#hsave').addEventListener('click', async e => {
    e.target.disabled = true;
    try { for (const h of D.holdings) { const i = $(`[data-ht="${h.id}"]`, sbody), v = (parseFloat(i && i.value) || 0) / 100; if (i && Math.abs(v - h.target) > 1e-9) await api.update('dime_holdings', h.id, { target: clamp(v, 0, 1) }); } await fin2('บันทึกเป้าหมายแล้ว'); }
    catch (err) { e.target.disabled = false; toast('ผิดพลาด: ' + (err.message || err), false); }
  });
  $('#hadd').addEventListener('click', async () => {
    const s = $('#hn-sym').value.trim().toUpperCase(), t = (parseFloat($('#hn-t').value) || 0) / 100;
    if (!s) return toast('ใส่ชื่อหุ้น', false); if (D.holdings.some(h => h.symbol === s)) return toast('มีหุ้นนี้อยู่แล้ว', false);
    try { await api.insert('dime_holdings', { symbol: s, target: clamp(t, 0, 1) }); await fin2('เพิ่มหุ้นแล้ว'); } catch (err) { toast('ผิดพลาด: ' + (err.message || err), false); }
  });
  sbody.querySelectorAll('[data-hdel]').forEach(btn => { let armed = false; btn.addEventListener('click', async () => {
    const h = D.holdings.find(x => x.id === +btn.dataset.hdel);
    if (!armed) { armed = true; btn.textContent = 'ลบ?'; btn.style.background = 'rgba(255,45,70,.25)'; setTimeout(() => { armed = false; btn.textContent = '✕'; btn.style.background = ''; }, 3000); return; }
    try { await api.remove('dime_holdings', h.id); await fin2('ลบ ' + h.symbol + ' แล้ว'); } catch (err) { toast('ผิดพลาด: ' + (err.message || err), false); }
  }); });
}
function errMsg(err) {
  const m = String(err.message || err);
  if (/check constraint|dime_accounts_kind_check/i.test(m)) return 'ต้องรัน schema_v3.sql ใน Supabase ก่อน จึงจะใช้หมวดนี้ได้';
  return 'ผิดพลาด: ' + m;
}

/* ---------- events ---------- */
function onClick(e) {
  const q = s => e.target.closest(s); let el;
  if ((el = q('[data-gseg]'))) return openGuide(el.dataset.gseg);
  if ((el = q('[data-guide]'))) return openGuide(el.dataset.guide);
  if (q('[data-dupes]')) return openDupes();
  if (q('[data-setup]')) return openSetup();
  if ((el = q('[data-edit]'))) { const [k, id] = el.dataset.edit.split(':'); return openForm(k, { edit: id }); }
  if ((el = q('[data-form]'))) { const ds = el.dataset; return openForm(ds.form, { id: ds.id, dir: ds.dir, sym: ds.sym }); }
  if ((el = q('[data-go]'))) { closeSheet(); return go(el.dataset.go); }
  if ((el = q('[data-pseg]'))) { S.pseg = el.dataset.pseg; return render('n'); }
  if ((el = q('[data-aseg]'))) { S.aseg = el.dataset.aseg; return render('n'); }
  if ((el = q('[data-filter]'))) { S.filter = el.dataset.filter; return render('n'); }
  if (q('[data-ovreset]')) { OV.px = {}; OV.fx = null; FX = D.fx; render('n'); return toast('รีเซ็ตเป็นค่าที่บันทึกแล้ว'); }
  if (q('[data-ovsave]')) return saveOv();
  if ((el = q('[data-rcur]'))) { const to = el.dataset.rcur; if (to !== S.rcur) { S.simIn = to === 'USD' ? Math.round(S.simIn / FX * 100) / 100 : Math.round(S.simIn * FX); S.rcur = to; } return render('n'); }
  if ((el = q('[data-q]'))) { S.simIn = +el.dataset.q; $('#sim-in').value = S.simIn; return refreshSim(); }
  if ((el = q('[data-sym]'))) return openHolding(el.dataset.sym);
  if ((el = q('[data-acc]'))) return openAccount(el.dataset.acc);
  if ((el = q('[data-debt]'))) return openDebt(el.dataset.debt);
}
view.addEventListener('click', onClick); sbody.addEventListener('click', onClick);
view.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'sim-in') { S.simIn = Math.max(0, parseFloat(t.value) || 0); refreshSim(); }
  else if (t.id === 'ov-fx') { const v = parseFloat(t.value); if (v > 0 && v !== D.fx) OV.fx = v; else OV.fx = null; FX = OV.fx ?? D.fx; refreshSim(); }
  else if (t.dataset.px) { const v = parseFloat(t.value), h = D.holdings.find(x => x.symbol === t.dataset.px); if (v > 0 && h && v !== h.price) OV.px[t.dataset.px] = v; else delete OV.px[t.dataset.px]; refreshSim(); }
});
async function saveOv() {
  const btn = $('#ov-save'); btn.disabled = true;
  try {
    for (const [symbol, price_usd] of Object.entries(OV.px)) await api.insert('dime_trades', { trade_date: today(), symbol, action: 'BUY', shares: 0, price_usd, fees_usd: 0, fx: FX, notes: 'อัปเดตราคา' });
    if (OV.fx != null && OV.fx !== D.fx) await api.upsertSettings({ fx: OV.fx });
    OV.px = {}; OV.fx = null; await refresh(true); toast('บันทึกราคา/FX แล้ว');
  } catch (err) { btn.disabled = false; toast('ผิดพลาด: ' + (err.message || err), false); }
}
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'add') return sheet.classList.contains('open') ? closeSheet() : openMenu();
  closeSheet(); go(b.dataset.tab);
});
$('#btn-help').addEventListener('click', () => openGuide(S.tab === 'portfolio' && S.pseg === 'rebalance' ? 'reb' : 'start'));
$('#btn-cur').addEventListener('click', () => { S.cur = S.cur === 'THB' ? 'USD' : 'THB'; store.set('cur', S.cur); render('n'); toast('แสดงเป็น ' + S.cur); });
const applyHide = () => { document.body.classList.toggle('hide', S.hide); $('#btn-eye').classList.toggle('on', S.hide); };
$('#btn-eye').addEventListener('click', () => { S.hide = !S.hide; store.set('hide', S.hide ? '1' : '0'); applyHide(); closeSheet(); { const k = view.scrollTop; render('n'); view.scrollTop = k; } toast(S.hide ? 'ซ่อนตัวเลขแล้ว' : 'แสดงตัวเลขแล้ว'); });
if (api) { $('#btn-out').hidden = false; $('#btn-out').addEventListener('click', () => api.signOut()); }
let tt; function toast(m, ok = true) {
  const t = $('#toast'); t.innerHTML = (ok ? `<span class="ok"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span>` : '') + `<span></span>`; t.lastChild.textContent = m;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1900);
}
document.addEventListener('pointerdown', e => {   // ripple
  const el = e.target.closest('.rip'); if (!el || reduced) return;
  const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, s = document.createElement('span');
  s.className = 'ripple'; s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  el.appendChild(s); setTimeout(() => s.remove(), 650);
}, { passive: true });
(() => {   // swipe แท็บ + pull to refresh
  let x0 = 0, y0 = 0, active = false, pulling = false, pull = 0; const ptr = $('#ptr');
  view.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; active = true; pulling = view.scrollTop <= 0; pull = 0; }, { passive: true });
  view.addEventListener('touchmove', e => {
    if (!active) return; const t = e.touches[0], dy = t.clientY - y0, dx = t.clientX - x0;
    if (pulling && dy > 0 && Math.abs(dy) > Math.abs(dx)) { pull = Math.min(dy * .5, 90); ptr.style.opacity = Math.min(1, pull / 50); ptr.style.transform = `translateY(${pull}px) scale(${.6 + Math.min(.4, pull / 150)}) rotate(${pull * 4}deg)`; }
  }, { passive: true });
  view.addEventListener('touchend', e => {
    if (!active) return; active = false; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (pull > 60) { ptr.classList.add('spin'); ptr.style.transform = 'translateY(50px) scale(1)'; setTimeout(async () => { await refresh(); ptr.classList.remove('spin'); ptr.style.opacity = 0; ptr.style.transform = ''; }, 500); }
    else { ptr.style.opacity = 0; ptr.style.transform = ''; }
    pull = 0;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50 && !e.target.closest('.filters,input')) { const i = TABS.indexOf(S.tab) + (dx < 0 ? 1 : -1); if (TABS[i]) go(TABS[i]); }
  }, { passive: true });
})();

/* ---------- boot ---------- */
applyHide(); render('n');
setTimeout(() => $('#splash').classList.add('out'), reduced ? 100 : 1300);
return { reload: nd => { setData(nd); render('n'); } };
};

</script>
<script>
/* เชื่อม Supabase: login → โหลดตาราง dime_* → สร้างข้อมูลรูปแบบเดียวกับ Excel + ส่วนการเงิน → startApp */
(() => {
  const $ = s => document.querySelector(s);
  const cfg = window.DIME_CONFIG;
  const sb = window.supabase.createClient(cfg.url, cfg.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const n = v => (v == null ? 0 : +v);
  const yr = d => +String(d).slice(0, 4);
  const MISSING = ['42P01', 'PGRST205', 'PGRST200'];   // ตารางยังไม่ถูกสร้าง (ยังไม่ได้รัน schema_v2.sql)
  let app = null, uid = null;

  async function load() {
    const q = (t, req = true) => sb.from(t).select('*').limit(5000).then(r => {
      if (r.error && !req && MISSING.includes(r.error.code)) return { data: [], error: null, missing: true };
      return r;
    });
    const [st, hd, tr, cf, dv, ac, mv, db, pm] = await Promise.all([
      q('dime_settings'), q('dime_holdings'), q('dime_trades'), q('dime_cashflow'), q('dime_dividends'),
      q('dime_accounts', false), q('dime_account_moves', false), q('dime_debts', false), q('dime_debt_payments', false)]);
    for (const r of [st, hd, tr, cf, dv, ac, mv, db, pm]) if (r.error) throw r.error;
    const needsMigration = [ac, mv, db, pm].some(r => r.missing);
    const set = st.data[0] || {};
    // ราคาล่าสุด = รายการล่าสุดตามวันที่แล้วตาม id (เหมือน XLOOKUP ใน Excel)
    const asc = [...tr.data].sort((a, b) => a.trade_date.localeCompare(b.trade_date) || a.id - b.id);
    const shares = {}, price = {};
    asc.forEach(t => { shares[t.symbol] = (shares[t.symbol] || 0) + (t.action === 'SELL' ? -1 : 1) * n(t.shares); price[t.symbol] = n(t.price_usd); });
    const trades = [...asc].reverse().map(t => ({ id: t.id, cost: t.cost_basis_usd, date: t.trade_date, symbol: t.symbol, action: t.action, shares: n(t.shares), price: n(t.price_usd),
      gross: n(t.gross_usd), fees: n(t.fees_usd), net: n(t.net_usd), fx: n(t.fx), netThb: n(t.net_thb), gainThb: n(t.realized_thb), note: t.notes || '' }));
    const cashflow = cf.data.map(c => ({ id: c.id, date: c.flow_date, type: c.type, thb: n(c.thb_amount), usd: n(c.usd_amount), fx: n(c.fx), direction: c.direction || '', note: c.notes || '' }))
      .sort((a, b) => b.date.localeCompare(a.date));
    const dividends = dv.data.map(d => ({ id: d.id, note: d.notes || '', date: d.div_date, symbol: d.symbol, grossUsd: n(d.gross_usd), taxUsd: n(d.tax_usd), netUsd: n(d.net_usd), fx: n(d.fx),
      grossThb: n(d.gross_thb), taxThb: n(d.tax_thb), netThb: n(d.net_thb) })).sort((a, b) => b.date.localeCompare(a.date));
    const years = new Set(Array.from({ length: 10 }, (_, i) => 2026 + i));
    [...trades, ...cashflow, ...dividends].forEach(x => years.add(yr(x.date)));
    const inY = (arr, y) => arr.filter(x => yr(x.date) === y);
    const sum = (arr, k) => arr.reduce((a, x) => a + x[k], 0);
    const tax = [...years].sort().map(y => ({ year: y, realizedThb: sum(inY(trades, y), 'gainThb'), grossDivThb: sum(inY(dividends, y), 'grossThb'),
      foreignTaxThb: sum(inY(dividends, y), 'taxThb'), netDivThb: sum(inY(dividends, y), 'netThb'),
      remitThb: sum(inY(cashflow, y).filter(c => c.type === 'Remittance to Thailand'), 'thb'), fundingThb: sum(inY(cashflow, y).filter(c => c.type === 'Funding'), 'thb') }));

    const accounts = ac.data.map(a => {
      const moves = mv.data.filter(m => m.account_id === a.id).map(m => ({ id: m.id, date: m.move_date, amount: n(m.amount_thb), note: m.note || '' }))
        .sort((x, y) => y.date.localeCompare(x.date) || y.id - x.id);
      return { id: a.id, name: a.name, kind: a.kind, note: a.note || '', moves, balance: moves.reduce((s, m) => s + m.amount, 0) };
    });
    const debts = db.data.map(d => {
      const payments = pm.data.filter(p => p.debt_id === d.id).map(p => ({ id: p.id, date: p.pay_date, amount: n(p.amount_thb), note: p.note || '' }))
        .sort((x, y) => y.date.localeCompare(x.date) || y.id - x.id);
      const paid = payments.reduce((s, p) => s + p.amount, 0);
      return { id: d.id, name: d.name, kind: d.kind, principal: n(d.principal_thb), rate: n(d.interest_rate), minPay: n(d.min_payment_thb),
        dueDay: d.due_day, startedOn: d.started_on, note: d.note || '', payments, paid, balance: Math.max(0, n(d.principal_thb) - paid) };
    });
    return {
      updated: new Date().toISOString().slice(0, 10), fx: n(set.fx) || 33, contributionThb: n(set.contribution_thb), needsMigration,
      settings: { income: n(set.monthly_income_thb), expense: n(set.monthly_expense_thb), targetMonths: n(set.emergency_target_months) || 6 },
      holdings: hd.data.map(h => ({ id: h.id, symbol: h.symbol, target: n(h.target), shares: shares[h.symbol] || 0, price: price[h.symbol] || 0 })),
      trades, cashflow, dividends, tax, accounts, debts
    };
  }
  const api = {
    load,
    async insert(table, row) { const { data, error } = await sb.from(table).insert(row).select().single(); if (error) throw error; return data; },
    async update(table, id, row) { const { data, error } = await sb.from(table).update(row).eq('id', id).select(); if (error) throw error; if (!data || !data.length) throw new Error('ไม่พบรายการ หรือไม่มีสิทธิ์แก้ไข'); },
    async remove(table, id) { const { data, error } = await sb.from(table).delete().eq('id', id).select(); if (error) throw error; if (!data || !data.length) throw new Error('ไม่พบรายการ หรือไม่มีสิทธิ์ลบ'); },
    async removeMany(table, ids) { if (!ids.length) return; const { error } = await sb.from(table).delete().in('id', ids); if (error) throw error; },
    async upsertSettings(row) { const { error } = await sb.from('dime_settings').upsert({ ...row, user_id: uid, updated_at: new Date().toISOString() }, { onConflict: 'user_id' }); if (error) throw error; },
    async signOut() { await sb.auth.signOut(); location.reload(); }
  };

  async function enter() {
    $('#login').hidden = true;
    try {
      const { data: { session } } = await sb.auth.getSession(); uid = session && session.user.id;
      const data = await load();
      if (app) app.reload(data); else app = window.startApp(data, api);
    } catch (e) {
      $('#login').hidden = false; const el = $('#login-err'); el.hidden = false;
      el.textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + (e.message || e) + ' — ตรวจว่ารัน supabase/schema.sql แล้ว';
      document.getElementById('splash').classList.add('out');
    }
  }
  $('#loginform').addEventListener('submit', async e => {
    e.preventDefault(); const f = new FormData(e.target), err = $('#login-err'), btn = $('.btn', e.target);
    btn.disabled = true; err.hidden = true;
    const { error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
    btn.disabled = false;
    if (error) { err.hidden = false; err.textContent = error.message === 'Invalid login credentials' ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : error.message; return; }
    enter();
  });
  sb.auth.getSession().then(({ data }) => {
    if (data.session) enter(); else { $('#login').hidden = false; $('#splash').classList.add('out'); }
  });
})();

</script>
