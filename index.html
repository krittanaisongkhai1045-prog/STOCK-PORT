<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WealthOS">
<meta name="theme-color" content="#06080f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>WealthOS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg0:#06080f;--bg1:#0b0e1a;--bg2:#111422;--bg3:#181c2e;--bg4:#1f2438;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --text:#dde3f8;--muted:#515878;--muted2:#7c85aa;
  --g:#00dfa0;--b:#4b96ff;--y:#f0b730;--r:#ff4f6a;--p:#b87dff;--o:#ff8c42;
  --ga:rgba(0,223,160,.13);--ba:rgba(75,150,255,.13);--ya:rgba(240,183,48,.13);
  --ra:rgba(255,79,106,.13);--pa:rgba(184,125,255,.13);--oa:rgba(255,140,66,.13);
  --rad:14px;--rads:9px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;font-size:14px}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg0);color:var(--text);
  min-height:100dvh;overflow-x:hidden;line-height:1.55;padding-bottom:calc(68px + var(--safe-b))}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(0,223,160,.04),transparent),
             radial-gradient(ellipse 60% 40% at 80% 110%,rgba(75,150,255,.04),transparent)}
#app{position:relative;z-index:1;max-width:430px;margin:0 auto}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:200;background:rgba(6,8,15,.92);
  backdrop-filter:blur(28px);border-bottom:1px solid var(--border);
  padding:calc(var(--safe-t)+9px) 16px 9px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:900;font-size:17px;letter-spacing:-.03em;flex-shrink:0;
  background:linear-gradient(120deg,var(--g),var(--b));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
#tt{font-weight:700;font-size:14px;flex:1;text-align:center}
#ta{flex-shrink:0}

/* STATUS & PRICE BAR */
.sbar{display:flex;align-items:center;gap:6px;padding:5px 12px;
  font-size:10px;color:var(--muted2);border-bottom:1px solid var(--border);background:var(--bg1)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bg4);
  border-top-color:var(--g);border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.pricebar{display:flex;gap:7px;overflow-x:auto;padding:6px 12px;
  border-bottom:1px solid var(--border);background:var(--bg1);scrollbar-width:none}
.pricebar::-webkit-scrollbar{display:none}
.pchip{display:flex;flex-direction:column;align-items:center;background:var(--bg2);
  border:1px solid var(--border);border-radius:8px;padding:5px 10px;flex-shrink:0;min-width:66px}
.pchip .ps{font-size:9px;color:var(--muted2);font-weight:700}
.pchip .pp{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.pchip .pc{font-size:9px;font-weight:600}
.pchip.up .pp,.pchip.up .pc{color:var(--g)}.pchip.dn .pp,.pchip.dn .pc{color:var(--r)}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;z-index:200;background:rgba(11,14,26,.97);
  backdrop-filter:blur(24px);border-top:1px solid var(--border);
  display:flex;padding-bottom:var(--safe-b)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:9px 0 8px;border:none;background:transparent;color:var(--muted);cursor:pointer;
  font-family:'Outfit',sans-serif;font-size:9px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;transition:color .15s}
.nb .ic{font-size:18px;transition:transform .2s}
.nb.active{color:var(--g)}.nb.active .ic{transform:translateY(-2px)}

/* PAGES */
.page{display:none;padding:12px}
.page.active{display:block;animation:fu .18s ease}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* SUB TABS */
.stabs{display:flex;background:var(--bg2);border-radius:10px;padding:3px;margin-bottom:12px;gap:2px}
.stab{flex:1;padding:7px;border:none;background:transparent;border-radius:8px;
  color:var(--muted);font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .15s;text-align:center}
.stab.active{background:var(--bg4);color:var(--text)}

/* KPI */
.kg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.kg.c3{grid-template-columns:1fr 1fr 1fr}.kg.c1{grid-template-columns:1fr}.kg.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.kpi{background:var(--bg1);border:1px solid var(--border);border-radius:var(--rad);padding:12px 13px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:-20px;right:-20px;width:58px;height:58px;border-radius:50%;opacity:.18}
.kpi.g::after{background:var(--g)}.kpi.b::after{background:var(--b)}
.kpi.y::after{background:var(--y)}.kpi.r::after{background:var(--r)}
.kpi.p::after{background:var(--p)}.kpi.o::after{background:var(--o)}
.kl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kv{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;margin-top:2px;line-height:1.2}
.kv.g{color:var(--g)}.kv.b{color:var(--b)}.kv.y{color:var(--y)}.kv.r{color:var(--r)}
.kv.p{color:var(--p)}.kv.o{color:var(--o)}
.ks{font-size:9px;color:var(--muted);margin-top:2px}
.kico{font-size:15px;margin-bottom:4px}

/* CARD */
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--rad);margin-bottom:11px;overflow:hidden}
.ch{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ct{font-weight:700;font-size:12px;display:flex;align-items:center;gap:5px}
.cb{padding:12px 14px}

/* SECTION LABEL */
.sec-label{font-size:11px;font-weight:700;color:var(--muted2);text-transform:uppercase;
  letter-spacing:.1em;margin:14px 0 7px;padding-left:2px;display:flex;align-items:center;gap:6px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* TAG */
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tg{background:var(--ga);color:var(--g);border:1px solid rgba(0,223,160,.2)}
.tb{background:var(--ba);color:var(--b);border:1px solid rgba(75,150,255,.2)}
.ty{background:var(--ya);color:var(--y);border:1px solid rgba(240,183,48,.2)}
.tr{background:var(--ra);color:var(--r);border:1px solid rgba(255,79,106,.2)}
.tp{background:var(--pa);color:var(--p);border:1px solid rgba(184,125,255,.2)}
.to{background:var(--oa);color:var(--o);border:1px solid rgba(255,140,66,.2)}
.tm{background:rgba(255,255,255,.05);color:var(--muted2);border:1px solid var(--border)}

/* BUTTONS */
.btn{padding:9px 18px;border-radius:var(--rads);border:none;cursor:pointer;
  font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:all .15s;white-space:nowrap;line-height:1}
.btn-g{background:var(--g);color:#031209}.btn-b{background:var(--b);color:#fff}
.btn-y{background:var(--y);color:#0a0700}.btn-r{background:var(--r);color:#fff}
.btn-p{background:var(--p);color:#0a0316}
.btn-ghost{background:var(--bg3);color:var(--muted2);border:1px solid var(--border)}
.btn-sm{padding:6px 13px;font-size:12px}.btn-xs{padding:4px 9px;font-size:11px;border-radius:6px}
.btn-full{width:100%}.btico{padding:6px 8px;font-size:14px}

/* FORMS */
.fg{margin-bottom:11px}
.fl{display:block;font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:5px}
.fi,.fs{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--rads);color:var(--text);font-family:'Outfit',sans-serif;
  font-size:14px;outline:none;transition:border-color .15s;-webkit-appearance:none}
.fi:focus,.fs:focus{border-color:var(--g)}.fs option{background:var(--bg2)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fhint{font-size:10px;color:var(--muted);margin-top:3px}.fhint.ok{color:var(--g)}

/* MODAL */
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.83);
  backdrop-filter:blur(10px);z-index:500;align-items:flex-end;justify-content:center}
.mov.open{display:flex}
.modal{background:var(--bg1);border:1px solid var(--border2);border-radius:20px 20px 0 0;
  width:100%;max-width:430px;max-height:93dvh;overflow-y:auto;
  padding-bottom:calc(14px + var(--safe-b));animation:mu .22s cubic-bezier(.32,.72,0,1)}
@keyframes mu{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
.mh2{width:38px;height:4px;background:var(--bg4);border-radius:4px;margin:11px auto 0}
.mhead{padding:13px 18px 0;display:flex;align-items:center;justify-content:space-between}
.mtitle{font-weight:800;font-size:15px}
.mbody{padding:13px 18px}.mfoot{padding:0 18px;display:flex;gap:9px}

/* ASSET CARD */
.asset{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rads);padding:11px 13px;margin-bottom:8px}
.asy{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px}
.aname{font-size:10px;color:var(--muted2);margin-top:1px}
.arow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.acell{flex:1;min-width:60px}
.acl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.acv{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;margin-top:1px}
.divl{height:1px;background:var(--border);margin:8px 0}
.pos{color:var(--g)}.neg{color:var(--r)}
.mono{font-family:'JetBrains Mono',monospace}
.pbar-w{background:var(--bg4);border-radius:4px;height:5px;overflow:hidden;margin:3px 0}
.pbar{height:100%;border-radius:4px;transition:width .5s ease}

/* DEBT CARD */
.debt-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rads);padding:12px 14px;margin-bottom:8px}
.debt-name{font-weight:700;font-size:13px;margin-bottom:2px}
.debt-prog{margin-top:8px}

/* REBALANCE */
.reb{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rads);padding:10px 13px;margin-bottom:7px}

/* ══ DESKTOP LAYOUT (≥900px) ══════════════════════════════════════════ */
@media(min-width:900px){
  body{padding-bottom:0;font-size:15px}
  .bnav,.sbar,.pricebar,.topbar{display:none!important}
  #app{max-width:100%;display:grid;grid-template-columns:220px 1fr;min-height:100dvh}
  #sidebar{grid-column:1;grid-row:1;background:var(--bg1);border-right:1px solid var(--border);
    display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;overflow-y:auto;padding-bottom:20px}
  .sb-logo{padding:20px 20px 16px;font-weight:900;font-size:18px;letter-spacing:-.03em;
    background:linear-gradient(120deg,var(--g),var(--b));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;border-bottom:1px solid var(--border);margin-bottom:8px}
  .sb-nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
  .sb-btn{display:flex;align-items:center;gap:9px;padding:10px 11px;border:none;
    background:transparent;color:var(--muted);cursor:pointer;border-radius:9px;
    font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;text-align:left;
    transition:all .15s;width:100%}
  .sb-btn .ic{font-size:17px;flex-shrink:0}
  .sb-btn:hover{background:var(--bg3);color:var(--text)}
  .sb-btn.active{background:rgba(0,223,160,.12);color:var(--g)}
  .sb-section{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;
    padding:14px 14px 4px;font-weight:700}
  .sb-prices{margin:8px 8px 0;padding:10px 11px;background:var(--bg2);
    border:1px solid var(--border);border-radius:10px}
  .sb-prow{display:flex;justify-content:space-between;align-items:center;
    padding:3px 0;border-bottom:1px solid var(--border)}
  .sb-prow:last-child{border-bottom:none}
  .sb-psym{font-weight:700;color:var(--muted2);font-size:10px}
  .sb-pval{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px}
  .sb-pchg{font-size:9px;font-weight:600}
  .sup .sb-pval,.sup .sb-pchg{color:var(--g)}.sdn .sb-pval,.sdn .sb-pchg{color:var(--r)}
  .sb-status{margin:6px 8px 0;padding:6px 11px;background:var(--bg2);border:1px solid var(--border);
    border-radius:9px;font-size:10px;color:var(--muted2);display:flex;align-items:center;gap:5px}
  #desktop-main{grid-column:2;overflow-y:auto;background:var(--bg0)}
  #dh{display:flex;align-items:center;justify-content:space-between;
    padding:20px 28px 0;margin-bottom:2px}
  #dh h1{font-size:20px;font-weight:800;letter-spacing:-.03em}
  #dh-right{display:flex;align-items:center;gap:10px}
  .page{padding:12px 28px 28px;max-width:1300px}
  .page.active{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .full-w{grid-column:1/-1}
  .kg{margin-bottom:0}.card{margin-bottom:0}
  .kpi{padding:14px 16px}.kv{font-size:17px}
}
@media(min-width:900px) and (max-width:1199px){.page.active{grid-template-columns:1fr}}
@media(min-width:1400px){.page.active{grid-template-columns:1fr 1fr 1fr}}

/* TOAST */
#toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(30px);
  background:var(--bg2);border:1px solid var(--border2);border-radius:26px;
  padding:8px 18px;font-size:13px;z-index:9999;transition:all .22s;
  pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.6);white-space:nowrap;opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div id="app">
<div class="topbar">
  <div class="logo">⬡ WealthOS</div>
  <div id="tt"></div>
  <div id="ta"></div>
</div>
<div class="sbar">
  <div class="spin" id="pspin" style="display:none"></div>
  <span id="stxt" style="flex:1">กำลังดึงราคาสด...</span>
  <button onclick="fetchPrices()" style="background:none;border:none;cursor:pointer;font-size:13px;padding:0 2px" title="รีเฟรช">🔄</button>
</div>
<div class="pricebar" id="pbar2"></div>

<!-- DESKTOP SIDEBAR (hidden on mobile via CSS) -->
<div id="sidebar">
  <div class="sb-logo">⬡ WealthOS</div>
  <div class="sb-nav">
    <div class="sb-section">เมนูหลัก</div>
    <button class="sb-btn active" data-p="dash"    onclick="go('dash')">   <span class="ic">📊</span> ภาพรวม</button>
    <button class="sb-btn"        data-p="invest"  onclick="go('invest')"> <span class="ic">📈</span> การลงทุน</button>
    <button class="sb-btn"        data-p="rebal"   onclick="go('rebal')">  <span class="ic">⚖️</span> Rebalance</button>
    <button class="sb-btn"        data-p="money"   onclick="go('money')">  <span class="ic">🏦</span> การเงิน</button>
    <button class="sb-btn"        data-p="scan"    onclick="go('scan')">   <span class="ic">🔍</span> สแกนหุ้น</button>
  </div>
  <div class="sb-section" style="margin-top:10px">ราคาสด</div>
  <div class="sb-prices" id="sb-prices"><div style="color:var(--muted);font-size:10px">กำลังโหลด...</div></div>
  <div class="sb-status" id="sb-status">
    <div class="spin" id="sb-spin" style="display:none"></div>
    <span id="sb-stxt">—</span>
  </div>
  <div style="padding:8px 8px 0">
    <button class="btn btn-ghost btn-full btn-sm" onclick="fetchPrices()" style="font-size:11px">🔄 รีเฟรชราคา</button>
  </div>
</div>

<!-- DESKTOP MAIN -->
<div id="desktop-main">
  <div id="dh" style="display:none">
    <h1 id="dh-title">📊 ภาพรวม</h1>
    <div id="dh-right"></div>
  </div>

<div class="page active" id="pg-dash"></div>
<div class="page" id="pg-invest"></div>
<div class="page" id="pg-rebal"></div>
<div class="page" id="pg-money"></div>
<div class="page" id="pg-scan"></div>
</div><!-- /desktop-main -->

<nav class="bnav">
  <button class="nb active" data-p="dash"    onclick="go('dash')"><span class="ic">📊</span>Overview</button>
  <button class="nb"        data-p="invest"  onclick="go('invest')"><span class="ic">📈</span>ลงทุน</button>
  <button class="nb"        data-p="rebal"   onclick="go('rebal')"><span class="ic">⚖️</span>Rebalance</button>
  <button class="nb"        data-p="money"   onclick="go('money')"><span class="ic">🏦</span>การเงิน</button>
  <button class="nb"        data-p="scan"    onclick="go('scan')"><span class="ic">🔍</span>สแกนหุ้น</button>
</nav>
</div>

<!-- ══ MODALS ══════════════════════════════════════════════════════════ -->

<!-- INVEST -->
<div class="mov" id="m-inv"><div class="modal">
  <div class="mh2"></div>
  <div class="mhead"><div class="mtitle" id="mi-t">➕ เพิ่มสินทรัพย์</div><button class="btn btn-ghost btn-xs" onclick="cm('m-inv')">✕</button></div>
  <div class="mbody">
    <div class="fg"><label class="fl">Symbol</label><input class="fi" id="mi-sym" placeholder="เช่น NVDA, IVV..." list="sdl" autocomplete="off" oninput="onSym(this.value)"><datalist id="sdl"></datalist><div class="fhint ok" id="mi-sh"></div></div>
    <div class="fg"><label class="fl">ชื่อเต็ม</label><input class="fi" id="mi-name" placeholder="ชื่อสินทรัพย์"></div>
    <div class="fr">
      <div class="fg"><label class="fl">Sector</label><select class="fs" id="mi-cat"><option value="BASE">🏛️ ฐาน</option><option value="BRAIN">🧠 Software/AI</option><option value="SEMI">🔬 Semiconductor</option><option value="CYBER">🔐 Cybersecurity</option><option value="ENERGY">⚡ Energy</option><option value="MATERIAL">🪨 วัตถุดิบ</option><option value="OTHER">📦 อื่นๆ</option></select></div>
      <div class="fg"><label class="fl">วันที่ซื้อ</label><input class="fi" type="date" id="mi-date"></div>
    </div>
    <div class="fr">
      <div class="fg"><label class="fl">จำนวนหุ้น</label><input class="fi" type="number" id="mi-qty" placeholder="0" step="any" oninput="calcTotal()"></div>
      <div class="fg"><label class="fl">ราคาซื้อ (USD)</label><input class="fi" type="number" id="mi-buy" placeholder="0.00" step="any" oninput="calcTotal()"></div>
    </div>
    <div class="fg"><label class="fl">เงินที่ลงทุน (฿)</label><input class="fi" type="number" id="mi-total" placeholder="คำนวณอัตโนมัติ" step="any"><div class="fhint" id="mi-th"></div></div>
    <div class="fg"><label class="fl">ราคาปัจจุบัน (USD)</label><input class="fi" type="number" id="mi-cur" placeholder="0.00" step="any"><div class="fhint ok" id="mi-ch"></div></div>
    <div class="fg"><label class="fl">% เป้าหมายในพอร์ต</label><input class="fi" type="number" id="mi-tgt" placeholder="เช่น 30" step="0.5" min="0" max="100"></div>
  </div>
  <div class="mfoot"><button class="btn btn-b btn-full" onclick="saveInv()">💾 บันทึก</button><button class="btn btn-ghost" onclick="cm('m-inv')">ยกเลิก</button></div>
</div></div>

<!-- UPDATE PRICE -->

/* ══ PRICE FETCHING — Multi-proxy with fallback ══════════════════════
   ลำดับการลอง:
   1. Yahoo Finance v8 via corsproxy.io

/* ══ FINNHUB PRICE ENGINE ════════════════════════════════════════════
   Finnhub API — ฟรี 60 req/นาที, ไม่มีปัญหา CORS, ใช้ได้ตรงจาก browser
   API Key: d9pdii9r01qo4gjcvba0d9pdii9r01qo4gjcvbag
   Docs: https://finnhub.io/docs/api/quote
════════════════════════════════════════════════════════════════════ */
const FINNHUB_KEY = 'd9pdii9r01qo4gjcvba0d9pdii9r01qo4gjcvbag';
const FINNHUB_BASE = 'https://finnhub.io/api/v1';

// แปลง Symbol พิเศษสำหรับ Finnhub
function toFinnhubSym(sym){
  // Forex pairs — ใช้ FX endpoint แยก
  if(sym==='USDTHB=X') return null; // จัดการแยก
  // BRK.B → BRK.B (Finnhub ใช้ . ได้)
  return sym;
}

// ดึงอัตราแลกเปลี่ยน USD/THB จาก exchangerate-api (ฟรี ไม่ต้อง key)
async function fetchUsdThb(){
  try{
    const res=await fetch('https://open.er-api.com/v6/latest/USD',{signal:AbortSignal.timeout(6000)});
    const json=await res.json();
    if(json?.rates?.THB){
      DB.usdthb=json.rates.THB;
      return json.rates.THB;
    }
  }catch(e){
    console.log('USD/THB fetch failed, using saved rate');
  }
  return DB.usdthb||35;
}

// ดึงราคาหุ้นตัวเดียวจาก Finnhub
async function finnhubQuote(sym){
  const url=`${FINNHUB_BASE}/quote?symbol=${encodeURIComponent(sym)}&token=${FINNHUB_KEY}`;
  const res=await fetch(url,{signal:AbortSignal.timeout(6000)});
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const q=await res.json();
  // q.c = current price, q.dp = % change, q.pc = previous close
  if(!q.c||q.c===0) throw new Error('No price data');
  return{price:q.c, chg:q.dp||0, prev:q.pc||q.c};
}

async function fetchPrices(){
  const stockSyms=[...new Set(DB.investments.map(i=>i.sym))].filter(Boolean);
  if(!stockSyms.length){setS(false,'ยังไม่มีสินทรัพย์');return;}

  setS(true,'กำลังดึงราคาสด...');

  // ดึง USD/THB ก่อน (ไม่นับ rate limit)
  const usdthb=await fetchUsdThb();

  // ดึงหุ้นทีละตัว — Finnhub ไม่มี batch endpoint ในแผนฟรี
  // แต่ 60 req/min พอสำหรับพอร์ตปกติ
  let successCount=0;
  const errors=[];

  for(const sym of stockSyms){
    const fSym=toFinnhubSym(sym);
    if(!fSym) continue;
    try{
      const q=await finnhubQuote(fSym);
      LIVE[sym]={price:q.price, chg:q.chg, prev:q.prev};
      DB.investments.forEach(i=>{if(i.sym===sym) i.curPrice=q.price;});
      successCount++;
      // หน่วงเล็กน้อยเพื่อไม่เกิน rate limit (100ms ต่อตัว)
      await new Promise(r=>setTimeout(r,120));
    }catch(e){
      console.log(`${sym} failed:`,e.message);
      errors.push(sym);
    }
  }

  DB._lastFetch=Date.now();
  saveDB();

  const t=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  if(successCount>0){
    const errTxt=errors.length?` (ไม่ได้: ${errors.join(',')})`:'';
    setS(false,`✅ ${t} · ${successCount}/${stockSyms.length} ตัว · USD/THB ${fN(usdthb,2)}${errTxt}`);
  } else {
    setS(false,`❌ ดึงราคาไม่ได้ — ตรวจสอบ API Key หรือ internet`);
  }

  renderPriceBar();
  const cur=document.querySelector('.nb.active,.sb-btn.active')?.dataset.p;
  if(cur&&renders[cur]) renders[cur]();
}
function setS(l,t){
  document.getElementById('pspin').style.display=l?'inline-block':'none';
  document.getElementById('stxt').textContent=t;
  const sbSpin=document.getElementById('sb-spin');
  const sbTxt=document.getElementById('sb-stxt');
  if(sbSpin)sbSpin.style.display=l?'inline-block':'none';
  if(sbTxt)sbTxt.textContent=t;
}
function renderPriceBar(){

    if(sbPrices)sbPrices.innerHTML='<div style="color:var(--muted);font-size:10px">ยังไม่มีสินทรัพย์</div>';

  }).join('');
}

/* ══ CALC ═══════════════════════════════════════════════════════════ */
function calcInv(){
  const fx=DB.usdthb||35;
  let curVal=0,cost=0;
  DB.investments.forEach(i=>{curVal+=i.qty*(i.curPrice||i.buyPrice)*fx;cost+=(i.totalBaht||(i.qty*i.buyPrice*fx));});
  return{curVal,cost,pnl:curVal-cost,pnlP:cost>0?((curVal-cost)/cost)*100:0,count:DB.investments.length};
}
function calcRes(){
  const inc=DB.reserve.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
  const exp=DB.reserve.filter(x=>x.type==='expense').reduce((s,x)=>s+Math.abs(x.amount),0);
  return{bal:inc-exp,inc,exp};
}
function calcDiv(){
  const totalThb=DB.dividends.reduce((s,d)=>s+d.thb,0);
  const yr=new Date().getFullYear().toString();
  const thisYear=DB.dividends.filter(d=>d.date?.startsWith(yr)).reduce((s,d)=>s+d.thb,0);
  return{totalThb,thisYear,count:DB.dividends.length};
}
function calcDebt(){
  const totalDebt=DB.debts.reduce((s,d)=>s+(d.remaining||0),0);
  const totalOrig=DB.debts.reduce((s,d)=>s+(d.total||0),0);
  const totalPaid=DB.debts.reduce((s,d)=>s+(d.paid||0),0);
  const monthly=DB.debts.reduce((s,d)=>s+(d.monthly||0),0);
  return{totalDebt,totalOrig,totalPaid,monthly,count:DB.debts.length};
}

/* ══ BUILD CHART DATA (monthly 12M) ════════════════════════════════ */
function buildMonthLabels(n){
  const months=[];const now=new Date();
  for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.toISOString().slice(0,7));}
  const thM=['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const labels=months.map(m=>{const[y,mo]=m.split('-');return`${thM[parseInt(mo)]}${(parseInt(y)+543).toString().slice(2)}`;});
  return{months,labels};
}
function buildResData(months){
  return months.map(m=>DB.reserve.filter(t=>t.date&&t.date.slice(0,7)<=m).reduce((s,t)=>s+t.amount,0));
}
function buildDivData(months){
  // กำไรปันผลรายเดือน (ไม่ใช่สะสม)
  return months.map(m=>DB.dividends.filter(d=>d.date&&d.date.slice(0,7)===m).reduce((s,d)=>s+d.thb,0));
}

function previewRebal(){
  const port=parseFloat(document.getElementById('rb-port').value)||0;
  const add=parseFloat(document.getElementById('rb-add').value)||0;
  const prev=document.getElementById('rb-preview');
  if(add>0){prev.style.display='block';document.getElementById('rb-new-total').textContent=fB(port+add);}
  else prev.style.display='none';
}
function runRebal(){
  const portVal=parseFloat(document.getElementById('rb-port').value)||0;
  const addMoney=parseFloat(document.getElementById('rb-add').value)||0;
  const newTotal=portVal+addMoney;
  const fx=DB.usdthb||35;
  if(addMoney<=0){toast('กรุณากรอกเงินที่จะเพิ่ม',false);return;}
  const rows=DB.investments.filter(i=>(i.tgt||0)>0).map(i=>{
    const realVal=i.qty*(i.curPrice||i.buyPrice)*fx;
    const targetVal=newTotal*(i.tgt/100);
    const toBuy=targetVal-realVal;
    return{...i,realVal,targetVal,toBuy,sharesNeeded:toBuy>0?toBuy/((i.curPrice||i.buyPrice)*fx):0};
  }).sort((a,b)=>b.toBuy-a.toBuy);
  const tgtSum=DB.investments.reduce((s,i)=>s+(i.tgt||0),0);
  const sumToBuy=rows.reduce((s,r)=>s+(r.toBuy>0?r.toBuy:0),0);
  document.getElementById('reb-out').innerHTML=`
  <div class="card" style="border-color:rgba(0,223,160,.15)">
    <div class="ch"><span class="ct" style="color:var(--g)">📋 ผลการคำนวณ</span><span class="tag ${Math.abs(tgtSum-100)<0.1?'tg':'tr'}">${fN(tgtSum,1)}% target</span></div>
    <div style="padding:8px 14px;background:rgba(75,150,255,.06);border-bottom:1px solid var(--border);font-size:11px;color:var(--muted2)">
      พอร์ตก่อนเพิ่ม <b style="color:var(--b)">${fB(portVal)}</b> + เงินที่เพิ่ม <b style="color:var(--g)">${fB(addMoney)}</b> = <b style="color:var(--y)">${fB(newTotal)}</b>
    </div>
    <div style="padding:8px 10px">
      ${rows.map(r=>{
        const isBuy=r.toBuy>50,isOver=r.toBuy<-50;
        const col=isBuy?'var(--g)':isOver?'var(--r)':'var(--muted)';
        return`<div class="reb" style="border-left:3px solid ${col}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div><span class="mono" style="color:${SEC[r.cat]?.color||'#888'};font-weight:700">${r.sym}</span><span style="font-size:10px;color:var(--muted);margin-left:5px">${r.name?.slice(0,16)||''}</span></div>
            <span class="tag ${isBuy?'tg':isOver?'tr':'tm'}">${fN(r.tgt)}% เป้า</span>
          </div>
          <div style="margin-top:5px;font-size:13px;font-weight:700;color:${col}">
            ${isBuy?`🟢 ซื้อเพิ่ม ${fB(r.toBuy)} (~${fN(r.sharesNeeded,3)} หุ้น)`:isOver?`🔴 มากเกินเป้า ${fB(Math.abs(r.toBuy))} (ถือ/รอ)`:`⚪ ถือไว้ OK`}
          </div>
          <div style="display:flex;gap:10px;font-size:10px;color:var(--muted);margin-top:4px;flex-wrap:wrap">
            <span>มีอยู่ ${fB(r.realVal)}</span><span>เป้า ${fB(r.targetVal)}</span><span>ต่าง ${r.toBuy>=0?'+':''}${fB(r.toBuy)}</span>
          </div>
        </div>`;
      }).join('')}
      <div style="margin-top:8px;padding:9px 12px;background:var(--bg3);border-radius:8px;font-size:11px">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="color:var(--muted2)">รวมที่ต้องซื้อ</span><span class="mono pos">${fB(sumToBuy)}</span></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--muted2)">เงินที่จะเพิ่ม</span><span class="mono" style="color:var(--y)">${fB(addMoney)}</span></div>
        <div style="margin-top:5px;font-size:10px" class="${Math.abs(sumToBuy-addMoney)<50?'pos':'neg'}">${Math.abs(sumToBuy-addMoney)<50?'✅ ยอดตรง':'⚠️ ตรวจสอบ % เป้ารวม'}</div>
      </div>
    </div>
  </div>`;
}
function updateTgt(id,v){

  document.getElementById('dp-amt').value='';
  document.getElementById('dp-note').value='';
  document.getElementById('m-dpay').classList.add('open');

function saveDebtPay(){
  const date=document.getElementById('dp-date').value;
  const amt=parseFloat(document.getElementById('dp-amt').value);
  const note=document.getElementById('dp-note').value.trim();
  if(!date||isNaN(amt)||amt<=0){toast('กรุณากรอกข้อมูลให้ครบ',false);return;}
  DB.debtPayments.push({id:uid(),debtId:debtPayId,date,amount:amt,note});
  // อัปเดตยอดที่จ่ายและคงเหลือใน debt
  const d=DB.debts.find(x=>x.id===debtPayId);
  if(d){d.paid=(d.paid||0)+amt;d.remaining=Math.max(0,(d.remaining||0)-amt);}
  saveDB();cm('m-dpay');toast(`บันทึกการจ่าย ${fB(amt)} แล้ว`);rMoney();rDash();
}

  if(document.getElementById('c-pe')?.checked)   criteria.push('P/E ต่ำ / valuation ถูก');
  if(document.getElementById('c-52w')?.checked)  criteria.push('อยู่ใกล้ 52-week low');
  if(document.getElementById('c-ma')?.checked)   criteria.push('ราคาต่ำกว่า MA200 (dip)');
  if(document.getElementById('c-div')?.checked)  criteria.push('dividend yield สูง');

function copyPrompt(){
  if(!window._scanPrompt)return;
  navigator.clipboard.writeText(window._scanPrompt).then(()=>{document.getElementById('copy-ok').style.display='block';const b=document.getElementById('copy-btn');b.textContent='✅ Copied!';setTimeout(()=>{b.innerHTML='📋 Copy Prompt';},3000);}).catch(()=>{const ta=document.createElement('textarea');ta.value=window._scanPrompt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);document.getElementById('copy-ok').style.display='block';toast('Copy แล้วครับ!');});
}

/* ══ MODAL HELPERS ══════════════════════════════════════════════════ */
function om(id,mode,eid=null){
  editId=eid;
  const d=eid?(DB.investments.find(x=>x.id===eid)||DB.dividends.find(x=>x.id===eid)||DB.debts.find(x=>x.id===eid)||null):null;
  if(id==='m-inv'){
    document.getElementById('mi-t').textContent=mode==='new'?'➕ เพิ่มสินทรัพย์':'✏️ แก้ไขสินทรัพย์';
    const bp=d?.sym?KNOWN[d.sym]:null;
    document.getElementById('mi-sym').value=d?.sym||'';
    document.getElementById('mi-name').value=d?.name||bp?.name||'';
    document.getElementById('mi-cat').value=d?.cat||bp?.cat||'BASE';
    document.getElementById('mi-date').value=d?.date||today();
    document.getElementById('mi-qty').value=d?.qty||'';
    document.getElementById('mi-buy').value=d?.buyPrice||'';
    document.getElementById('mi-total').value=d?.totalBaht||'';
    document.getElementById('mi-cur').value=d?.curPrice||'';
    document.getElementById('mi-tgt').value=d?.tgt||bp?.tgt||0;
    document.getElementById('mi-sh').textContent='';
    document.getElementById('mi-ch').textContent=d?.sym&&LIVE[d.sym]?`📡 ราคาสด: ${fU(LIVE[d.sym].price)} (${fP(LIVE[d.sym].chg)})`: '';
    if(d?.sym) onSym(d.sym);
  }
  if(id==='m-res'){
    document.getElementById('mr-t').textContent=mode==='new'?'➕ บันทึกธุรกรรม':'✏️ แก้ไขธุรกรรม';
    const rd=eid?DB.reserve.find(x=>x.id===eid):null;
    document.getElementById('rr-d').value=rd?.date||today();
    document.getElementById('rr-t').value=rd?.type||'income';
    document.getElementById('rr-c').value=rd?.cat||'เงินเดือน';
    document.getElementById('rr-desc').value=rd?.desc||'';
    document.getElementById('rr-a').value=rd?Math.abs(rd.amount):'';
  }
  if(id==='m-debt'){
    document.getElementById('md-t').textContent=mode==='new'?'➕ เพิ่มรายการหนี้':'✏️ แก้ไขหนี้';
    const dd=d||(eid?DB.debts.find(x=>x.id===eid):null);
    document.getElementById('dt-name').value=dd?.name||'';
    document.getElementById('dt-type').value=dd?.type||'home';
    document.getElementById('dt-total').value=dd?.total||'';
    document.getElementById('dt-paid').value=dd?.paid||'';
    document.getElementById('dt-rem').value=dd?.remaining||'';
    document.getElementById('dt-rate').value=dd?.rate||'';
    document.getElementById('dt-monthly').value=dd?.monthly||'';
    document.getElementById('dt-due').value=dd?.due||'';
    document.getElementById('dt-note').value=dd?.note||'';
    document.getElementById('dt-hint').textContent='';
  }
  if(id==='m-div'){
    document.getElementById('mdiv-t').textContent=mode==='new'?'💰 บันทึกปันผล':'✏️ แก้ไขปันผล';
    document.getElementById('dv-sym').value=d?.sym||'';
    document.getElementById('dv-date').value=d?.date||today();
    document.getElementById('dv-usd').value=d?.usd||'';
    document.getElementById('dv-thb').value=d?.thb||'';
    document.getElementById('dv-note').value=d?.note||'';
    document.getElementById('dv-hint').textContent='';
  }
  document.getElementById(id).classList.add('open');
}
function cm(id){document.getElementById(id).classList.remove('open');editId=null;}
document.querySelectorAll('.mov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)cm(o.id);}));

/* ══ SAVE FUNCTIONS ═════════════════════════════════════════════════ */
function saveInv(){
  const sym=document.getElementById('mi-sym').value.toUpperCase().trim();
  const name=document.getElementById('mi-name').value.trim();
  const qty=parseFloat(document.getElementById('mi-qty').value);
  const buyP=parseFloat(document.getElementById('mi-buy').value);
  const totalBaht=parseFloat(document.getElementById('mi-total').value)||(qty*buyP*DB.usdthb);
  const curPrice=parseFloat(document.getElementById('mi-cur').value)||buyP;
  const cat=document.getElementById('mi-cat').value;
  const date=document.getElementById('mi-date').value;
  const tgt=parseFloat(document.getElementById('mi-tgt').value)||0;
  if(!sym||!name||isNaN(qty)||isNaN(buyP)){toast('กรุณากรอกข้อมูลให้ครบ',false);return;}
  const rec={id:editId||uid(),sym,name,cat,date,qty,buyPrice:buyP,totalBaht,curPrice,tgt};
  if(editId)DB.investments=DB.investments.map(x=>x.id===editId?rec:x);
  else DB.investments.push(rec);
  saveDB();cm('m-inv');toast('บันทึกสำเร็จ');rInvest();rDash();
}
function openPxMod(id,sym){
  pxEditId=id;
  document.getElementById('mp-t').textContent=`💹 อัปเดตราคา ${sym}`;
  document.getElementById('mp-px').value=DB.investments.find(x=>x.id===id)?.curPrice||'';
  document.getElementById('m-px').classList.add('open');
}
function savePx(){
  const p=parseFloat(document.getElementById('mp-px').value);
  if(isNaN(p)||p<0){toast('ราคาไม่ถูกต้อง',false);return;}
  const i=DB.investments.find(x=>x.id===pxEditId);
  if(i){i.curPrice=p;saveDB();}
  cm('m-px');toast('อัปเดตราคาแล้ว');rInvest();rDash();
}
function saveRes(){
  const date=document.getElementById('rr-d').value;
  const type=document.getElementById('rr-t').value;
  const cat=document.getElementById('rr-c').value;
  const desc=document.getElementById('rr-desc').value.trim();
  const raw=parseFloat(document.getElementById('rr-a').value);
  if(!date||!desc||isNaN(raw)||raw<=0){toast('กรุณากรอกข้อมูลให้ครบ',false);return;}
  const amount=type==='expense'?-raw:raw;
  const rec={id:editId||uid(),date,type,cat,desc,amount};
  if(editId)DB.reserve=DB.reserve.map(x=>x.id===editId?rec:x);
  else DB.reserve.push(rec);
  saveDB();cm('m-res');toast('บันทึกสำเร็จ');if(moneyTab==='reserve')renderReserveTab();rDash();
}
function calcDebtRem(){
  const total=parseFloat(document.getElementById('dt-total').value)||0;
  const paid=parseFloat(document.getElementById('dt-paid').value)||0;
  if(total>0){const rem=Math.max(0,total-paid);document.getElementById('dt-rem').value=fN(rem,2).replace(/,/g,'');document.getElementById('dt-hint').textContent=`${fB(total)} − ${fB(paid)} = ${fB(rem)}`;}
}
function saveDebt(){
  const name=document.getElementById('dt-name').value.trim();
  const type=document.getElementById('dt-type').value;
  const total=parseFloat(document.getElementById('dt-total').value)||0;
  const paid=parseFloat(document.getElementById('dt-paid').value)||0;
  const remaining=parseFloat(document.getElementById('dt-rem').value)||Math.max(0,total-paid);
  const rate=parseFloat(document.getElementById('dt-rate').value)||0;
  const monthly=parseFloat(document.getElementById('dt-monthly').value)||0;
  const due=document.getElementById('dt-due').value;
  const note=document.getElementById('dt-note').value.trim();
  if(!name||total<=0){toast('กรุณากรอกชื่อและยอดหนี้',false);return;}
  const rec={id:editId||uid(),name,type,total,paid,remaining,rate,monthly,due,note};
  if(editId)DB.debts=DB.debts.map(x=>x.id===editId?rec:x);
  else DB.debts.push(rec);
  saveDB();cm('m-debt');toast('บันทึกหนี้สำเร็จ');rMoney();rDash();
}
function calcDivBaht(){
  const usd=parseFloat(document.getElementById('dv-usd').value)||0;
  if(usd>0){const thb=usd*DB.usdthb;document.getElementById('dv-thb').value=fN(thb,2).replace(/,/g,'');document.getElementById('dv-hint').textContent=`${fU(usd)} × ${fN(DB.usdthb,2)} = ${fB(thb)}`;}
}
function saveDiv(){
  const sym=document.getElementById('dv-sym').value.toUpperCase().trim();
  const date=document.getElementById('dv-date').value;
  const usd=parseFloat(document.getElementById('dv-usd').value)||0;
  const thb=parseFloat(document.getElementById('dv-thb').value)||(usd*DB.usdthb);
  const note=document.getElementById('dv-note').value.trim();
  const dest=document.getElementById('dv-dest').value;
  if(!sym||!date||thb<=0){toast('กรุณากรอกข้อมูลให้ครบ',false);return;}
  const rec={id:editId||uid(),sym,date,usd,thb,note};
  if(editId)DB.dividends=DB.dividends.map(x=>x.id===editId?rec:x);
  else DB.dividends.push(rec);
  if(dest==='yes'){DB.reserve.push({id:uid(),date,type:'income',cat:'รายได้ลงทุน',desc:`ปันผล ${sym}${note?' — '+note:''}`,amount:thb});toast(`บันทึกแล้ว ✅ เพิ่ม ${fB(thb)} ในเงินสำรอง`);}
  else toast('บันทึกปันผลสำเร็จ');
  saveDB();cm('m-div');rScan();rDash();
}
function onSym(v){
  const sym=v.toUpperCase().trim();const bp=KNOWN[sym];
  const sh=document.getElementById('mi-sh');const ch=document.getElementById('mi-ch');
  if(bp){document.getElementById('mi-name').value=bp.name;document.getElementById('mi-cat').value=bp.cat;if(!document.getElementById('mi-tgt').value&&bp.tgt)document.getElementById('mi-tgt').value=bp.tgt;sh.textContent=`✓ ${bp.name}`;sh.className='fhint ok';}
  else{sh.textContent=sym?'📝 สินทรัพย์ใหม่':'';sh.className='fhint';}
  if(LIVE[sym]?.price){document.getElementById('mi-cur').value=LIVE[sym].price;ch.textContent=`📡 ราคาสด: ${fU(LIVE[sym].price)} (${fP(LIVE[sym].chg)})`;}
  else ch.textContent='';
  calcTotal();
}
function calcTotal(){
  const qty=parseFloat(document.getElementById('mi-qty').value)||0;
  const buy=parseFloat(document.getElementById('mi-buy').value)||0;
  if(qty&&buy){const baht=qty*buy*DB.usdthb;document.getElementById('mi-total').value=fN(baht,2).replace(/,/g,'');document.getElementById('mi-th').textContent=`${fN(qty)} × ${fU(buy)} × ${fN(DB.usdthb,2)} = ${fB(baht)}`;}
}
function doDelete(sec,id){
  document.getElementById('del-ok').onclick=()=>{
    DB[sec]=DB[sec].filter(x=>x.id!==id);
    // ถ้าลบ debt ให้ลบ payment ที่เกี่ยวข้องด้วย
    if(sec==='debts')DB.debtPayments=DB.debtPayments.filter(p=>p.debtId!==id);
    saveDB();cm('m-del');toast('ลบแล้ว');
    const cur=document.querySelector('.nb.active')?.dataset.p;
    if(renders[cur])renders[cur]();rDash();
  };
  document.getElementById('m-del').classList.add('open');
}
